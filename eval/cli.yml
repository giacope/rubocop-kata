# `rubocop-kata` commands run as a user runs them: the gem's executable, in a
# project directory, under the given environment. `hex` holds raw bytes.
- id: plan-under-lang-c
  gap: R8
  command: plan
  env: { LANG: C, LC_ALL: C }
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    lib/sample.rb: "# frozen_string_literal: true\n\ndef customer_home_address = 1\n"
  expect:
    status: [1]
    stdout: ["next: "]
    stderr_absent: ["Error", "\\.rb:\\d+:in "]
- id: plan-stages-every-kata-cop
  gap: R8
  command: plan
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    lib/sample.rb: "# frozen_string_literal: true\n\nVALUE = total(lines(\n  1\n))\n"
  expect:
    status: [1]
    stdout: ["Kata/PairedBrackets"]
    stdout_absent: ["^rest .*Kata/"]
- id: doctor-reads-inherit-from
  gap: R8
  command: doctor
  files:
    .rubocop.yml: "inherit_from: .rubocop_todo.yml\n\nplugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    .rubocop_todo.yml: "Elegant/GoodMethodName:\n  Exclude:\n    - lib/sample.rb\n"
    lib/sample.rb: "# frozen_string_literal: true\n"
  expect:
    status: [1]
    stdout: ["\\.rubocop_todo\\.yml:1: `Elegant/GoodMethodName`"]
- id: doctor-reports-unparsable-file
  gap: R8
  command: doctor
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    lib/broken.rb: "# rubocop:disable Kata/GoodClassName -- generated\ndef total(\n"
  expect:
    status: [1]
    stdout: ["broken\\.rb"]
- id: doctor-reports-undecodable-file
  gap: R8
  command: doctor
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
  hex:
    lib/binary.rb: "2320727562 6f636f703a656e61626c6520456c6567616e742f476f6f644d6574686f644e616d650a5641 4c5545203d2022ff220a"
  expect:
    status: [1]
    stdout: ["binary\\.rb"]
- id: doctor-names-an-unloadable-plugin
  gap: R16
  command: doctor
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n  - rubocop-missing-plugin\n"
    lib/sample.rb: "# frozen_string_literal: true\n"
  expect:
    status: [2]
    stdout: ["configuration does not load", "bundle exec rubocop-kata doctor"]
- id: doctor-lists-reasoned-disables
  gap: R9
  command: doctor
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    lib/sample.rb: "# frozen_string_literal: true\n\n# rubocop:disable Kata/GoodClassName -- Avo resolves the handler by this name\nclass Avo::Handler\nend\n# rubocop:enable Kata/GoodClassName\n"
  expect:
    stdout: ["Avo resolves the handler by this name"]
- id: doctor-clean-project
  gap: R8
  command: doctor
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    lib/sample.rb: "# frozen_string_literal: true\n"
  expect:
    status: [0]
    stdout: ["clean"]
- id: plan-clean-project
  gap: R8
  command: plan
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    lib/billing.rb: "# frozen_string_literal: true\n\nmodule Billing\nend\n"
  expect:
    status: [0]
    stdout: ["clean"]
- id: plan-takes-the-gem-name-and-node-types-for-words
  gap: R19
  command: plan
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    rubocop-shelf.gemspec: "Gem::Specification.new { it.add_dependency(\"rubocop\", \">= 1\") }\n"
    lib/shelf.rb: "# frozen_string_literal: true\n\nmodule Shelf\n  def self.on_lvasgn(node) = [node, :false]\n\n  def self.shelf(dstr, kwoptarg) = [dstr, kwoptarg]\nend\n"
  expect:
    stdout_absent: ["Kata/RealWords", "Lint/BooleanSymbol"]
- id: plan-still-reads-node-types-as-clippings-without-the-parser
  gap: R19
  command: plan
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    shelf.gemspec: "Gem::Specification.new { it.add_development_dependency(\"rubocop\") }\n"
    lib/shelf.rb: "# frozen_string_literal: true\n\nmodule Shelf\n  def self.on_lvasgn(node) = [node, :false]\nend\n"
  expect:
    status: [1]
    stdout: ["Kata/RealWords", "Lint/BooleanSymbol"]
- id: doctor-says-disabled-by-default-switches-kata-off
  gap: R21
  command: doctor
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n  DisabledByDefault: true\n"
    lib/sample.rb: "# frozen_string_literal: true\n"
  expect:
    status: [1]
    stdout: ["\\.rubocop\\.yml:6: `DisabledByDefault: true` leaves 26 of kata's 26 cops off"]
- id: doctor-calls-a-renamed-cop-entry-a-rename
  gap: R21
  command: doctor
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n\nNaming/PredicateName:\n  Exclude:\n    - lib/sample.rb\n"
    lib/sample.rb: "# frozen_string_literal: true\n"
  expect:
    status: [1]
    stdout: ["was renamed to `Naming/PredicatePrefix`; rename the entry", "0 dead entries, 1 entry to rename"]
    stdout_absent: ["does nothing"]
- id: r6b1-k2-plan-leaves-the-names-rails-calls-to-rails
  gap: R22
  command: plan
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    config/application.rb: "module Shop\n  class Application < Rails::Application\n  end\nend\n"
    app/models/taxonomy.rb: "# frozen_string_literal: true\n\nmodule Taxonomy\n  def self.table_name_prefix = \"taxonomy_\"\nend\n"
    app/models/hook.rb: "# frozen_string_literal: true\n\nclass Hook\n  def initialize(callback)\n    @callback = callback\n  end\n\n  def time_constraint_attributes=(value)\n    @callback.call(value)\n  end\n\n  def committed!(*) = @callback.call\n\n  def rolledback!(*) = @callback\nend\n"
  expect:
    stdout_absent: ["Kata/NoClassMethodLogic", "Kata/GoodMethodName", "Kata/RealWords"]
- id: r6b1-k4-plan-takes-an-autoloaded-lib-for-a-zeitwerk-root
  gap: R22
  command: plan
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    config/application.rb: "module Shop\n  class Application < Rails::Application\n    config.autoload_lib(ignore: %w[assets tasks])\n  end\nend\n"
    lib/description_remover.rb: "# frozen_string_literal: true\n\nclass DescriptionRemover\n  def initialize(taxon)\n    @taxon = taxon\n  end\nend\n"
  expect:
    stdout_absent: ["Kata/ClassInModule"]
- id: r6b1-k4-plan-still-wants-a-module-around-a-class-in-a-plain-lib
  gap: R22
  command: plan
  files:
    .rubocop.yml: "plugins:\n  - rubocop-kata\n\nAllCops:\n  TargetRubyVersion: 3.4\n"
    config/application.rb: "module Shop\n  class Application < Rails::Application\n  end\nend\n"
    lib/description_remover.rb: "# frozen_string_literal: true\n\nclass DescriptionRemover\n  def initialize(taxon)\n    @taxon = taxon\n  end\nend\n"
  expect:
    status: [1]
    stdout: ["Kata/ClassInModule"]
