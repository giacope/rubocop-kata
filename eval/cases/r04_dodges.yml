# Names minted without `def`, and the clock seam.
- id: attr-reader-three-words-flagged
  cop: Kata/GoodMethodName
  expect: offense
  source: |
    class Account::Holder
      attr_reader :user_home_page
    end
- id: attr-accessor-three-words-flagged
  cop: Kata/GoodMethodName
  expect: offense
  source: |
    class Account::Holder
      attr_accessor :billing_cycle_day
    end
- id: attr-writer-three-words-flagged
  cop: Kata/GoodMethodName
  expect: offense
  source: |
    class Account::Holder
      attr_writer :user_home_page
    end
- id: define-method-three-words-flagged
  cop: Kata/GoodMethodName
  expect: offense
  source: |
    class Account::Holder
      define_method(:user_home_page) { "x" }
    end
- id: alias-method-three-words-flagged
  cop: Kata/GoodMethodName
  expect: offense
  source: |
    class Account::Holder
      def name = "x"
      alias_method :user_home_page, :name
    end
- id: alias-keyword-three-words-flagged
  cop: Kata/GoodMethodName
  expect: offense
  source: |
    class Account::Holder
      def name = "x"
      alias user_home_page name
    end
- id: attr-reader-one-word-allowed
  cop: Kata/GoodMethodName
  expect: clean
  source: |
    class Account::Holder
      attr_reader :name, :created_at
    end
- id: attr-reader-abbreviation-flagged
  cop: Kata/RealWords
  expect: offense
  source: |
    class Account::Holder
      attr_reader :usr
    end
- id: clock-keyword-seam-allowed
