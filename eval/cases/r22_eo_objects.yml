- id: v1-p24-violation-real-no-nil-return
  cop: Kata/NoNilReturn
  expect: offense
  source: |
    # frozen_string_literal: true

    module Shop
      class Cart
        def initialize(catalog, codes)
          @catalog = catalog
          @codes = codes
        end

        def total
          @codes.sum do |code|
            item = @catalog.find(code)
            item.nil? ? 0 : item.price
          end
        end
      end
    end

    module Shop
      class Catalog
        def initialize(items)
          @items = items
        end

        def find(code)
          @items.detect { |item| item.code == code }
        end
      end
    end
