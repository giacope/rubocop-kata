- id: v1-p14-violation-real-public-surface
  cop: Kata/PublicSurface
  expect: offense
  source: |
    # frozen_string_literal: true

    module Shop
      class User
        def initialize(name, email, digest, plan)
          @name = name
          @email = email
          @digest = digest
          @plan = plan
        end

        def greeting
          "Dear #{@name}"
        end

        def signature
          "#{@name} <#{@email}>"
        end

        def authentic?(password)
          @digest == password.hash
        end

        def token
          "#{@email}:#{@digest}"
        end

        def premium?
          @plan == "premium"
        end

        def monthly
          premium? ? 2_000 : 500
        end

        def invoice
          "#{@name}: #{monthly}"
        end

        def mailto
          "mailto:#{@email}"
        end
      end
    end
