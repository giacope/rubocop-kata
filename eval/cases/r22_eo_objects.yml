# The V1 conformance cases (round 6) for the object principles of Elegant
# Objects: each principle's minimal and realistic violation is flagged, and its
# EO form is clean.
- id: v1-p19-violation-min-no-nil-argument
  cop: Kata/NoNilArgument
  expect: offense
  source: |
    # frozen_string_literal: true

    module Shop
      class Price
        def initialize(cents)
          @cents = cents
        end

        def discounted(coupon = nil)
          return @cents if coupon.nil?
          @cents - coupon.cents
        end
      end
    end
- id: v1-p19-violation-real-no-nil-argument
  cop: Kata/NoNilArgument
  expect: offense
  source: |
    # frozen_string_literal: true

    module Shop
      class Signup
        def initialize(email, referrer: nil)
          @email = email
          @referrer = referrer
        end

        def welcome
          return "Welcome, #{@email}" if @referrer.nil?
          "Welcome, #{@email}, invited by #{@referrer.name}"
        end

        def bonus
          @referrer&.credit || 0
        end
      end
    end
