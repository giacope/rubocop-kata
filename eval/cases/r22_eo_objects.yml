- id: v1-p20-compliant-alt-no-getter
  cop: Kata/NoGetter
  expect: clean
  source: |
    # frozen_string_literal: true

    module Shop
      class Card
        def initialize(fields)
          @fields = fields.freeze
        end

        def with(name, value)
          Card.new(@fields.merge(name => value))
        end

        def to_s
          @fields.map { |name, value| "#{name}: #{value}" }.join("\n")
        end
      end
    end

    module Shop
      class Customer
        def initialize(first, last, email)
          @first = first
          @last = last
          @email = email
        end

        def print(media)
          media.with("first", @first).with("last", @last).with("email", @email)
        end
      end
    end
