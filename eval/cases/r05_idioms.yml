# Idiomatic Ruby that a rule should leave alone, next to what it is for.
- id: constructor-mutex-allowed
  cop: Kata/ConstructorDiscipline
  expect: clean
  source: |
    class Cache::Store
      def initialize(items)
        @items = items
        @lock = Mutex.new
      end
    end
- id: constructor-kernel-conversion-allowed
  cop: Kata/ConstructorDiscipline
  expect: clean
  source: |
    class Cache::Store
      def initialize(items, name)
        @items = Array(items)
        @name = String(name)
      end
    end
- id: constructor-to-conversion-allowed
  cop: Kata/ConstructorDiscipline
  expect: clean
  source: |
    class Cache::Store
      def initialize(name, items)
        @name = name.to_s
        @items = items.to_a
      end
    end
- id: constructor-defensive-copy-allowed
  cop: Kata/ConstructorDiscipline
  expect: clean
  source: |
    class Cache::Store
      def initialize(items)
        @items = items.dup.freeze
      end
    end
- id: constructor-empty-collection-allowed
  cop: Kata/ConstructorDiscipline
  expect: clean
  source: |
    class Cache::Store
      def initialize
        @seen = Set.new
        @queue = Queue.new
      end
    end
- id: constructor-random-flagged
  cop: Kata/ConstructorDiscipline
  expect: offense
  source: |
    class Cache::Store
      def initialize
        @id = SecureRandom.uuid
      end
    end
- id: constructor-dependency-flagged
  cop: Kata/ConstructorDiscipline
  expect: offense
  source: |
    class Cache::Store
      def initialize(url)
        @client = Http::Client.new(url)
      end
    end
- id: constructor-computation-flagged
  cop: Kata/ConstructorDiscipline
  expect: offense
  source: |
    class Cache::Store
      def initialize(items)
        @total = items.sum
      end
    end
- id: class-load-dump-coder-allowed
  cop: Kata/NoClassMethodLogic
  expect: clean
  source: |
    class Money::Coder
      def self.load(text) = new(text)
      def self.dump(money) = money.to_s
    end
- id: class-json-create-allowed
  cop: Kata/NoClassMethodLogic
  expect: clean
  source: |
    class Money::Amount
      def self.json_create(object) = new(object["cents"])
    end
- id: class-query-flagged
  cop: Kata/NoClassMethodLogic
  expect: offense
  source: |
    class Money::Amount
      def self.active = all.select(&:active?)
    end
- id: hash-to-h-allowed
  cop: Kata/NoHashAsObject
  expect: clean
  source: |
    class Money::Amount
      def to_h = { cents: @cents, currency: @currency, scale: @scale, rounding: @rounding }
    end
- id: hash-as-json-allowed
  cop: Kata/NoHashAsObject
  expect: clean
  source: |
    class Money::Amount
      def as_json(*) = { cents: @cents, currency: @currency, scale: @scale, rounding: @rounding }
    end
- id: hash-deconstruct-keys-allowed
  cop: Kata/NoHashAsObject
  expect: clean
  source: |
    class Money::Amount
      def deconstruct_keys(_keys) = { cents: @cents, currency: @currency, scale: @scale, rounding: @rounding }
    end
- id: hash-payload-flagged
  cop: Kata/NoHashAsObject
  expect: offense
  source: |
