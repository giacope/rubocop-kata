- id: comparisons-with-a-custom-equality-are-not-flipped
  cop: Style/MultipleComparison
  expect: offense
  correct: safe
  keeps: ["    kind == :json || kind == :xml"]
  source: |
    # frozen_string_literal: true

    class Gate
      def open?(kind)
        kind == :json || kind == :xml
      end
    end
- id: own-fixnum-constant-is-not-replaced-by-integer
  cop: Lint/UnifiedInteger
  expect: offense
  correct: safe
  keeps: ["      Fixnum"]
  source: |
    # frozen_string_literal: true

    module Types
      Fixnum = :custom

      class Check
        def kind
          Fixnum
        end
      end
    end
- id: side-effecting-condition-is-not-collapsed
  cop: Style/RedundantCondition
  expect: offense
  correct: safe
  keeps: ["    @items.shift ? @items.shift : :none"]
  source: |
    # frozen_string_literal: true

    class Line
      def initialize
        @items = [1, 2]
      end

      def next_item
        @items.shift ? @items.shift : :none
      end
    end
