      end
    end
- id: yielding-block-is-not-turned-into-a-block-argument
  cop: Style/ExplicitBlockArgument
  expect: offense
  correct: safe
  keeps: ["    @items.each { |item| yield item }"]
  source: |
    # frozen_string_literal: true

    class Bag
      def initialize
        @items = [1]
      end

      def each_item
        @items.each { |item| yield item }
