- id: p17-entries-passed-in
  cop: Kata/NoSingleton
  expect: clean
  path: lib/shop/ledger.rb
  source: |
    # frozen_string_literal: true

    module Shop
      class Ledger
        def initialize(month, entries)
          @month = month
