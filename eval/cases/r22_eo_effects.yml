- id: p25-logged-default-and-modifier
  cop: Kata/FailFast
  expect: offense
  path: lib/shop/rates.rb
  source: |
    # frozen_string_literal: true

    require "json"

    module Shop
      class Rates
        def initialize(source, log)
          @source = source
          @log = log
        end

        def table
          JSON.parse(@source.read)
        rescue JSON::ParserError, IOError => error
          @log.warn("rates unavailable: #{error.message}")
          {}
        end

        def limit
          Integer(@source.limit) rescue 0
        end
      end
    end
