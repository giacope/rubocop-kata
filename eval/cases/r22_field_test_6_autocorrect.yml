  source: |
    # frozen_string_literal: true

    module Demo
      module Model
        def index_name
          @index_name ||= begin
            [options.key?(:index_prefix) ? options[:index_prefix] : Demo.index_prefix, model_name.plural, Demo.env, Demo.index_suffix].compact.join("_")
          end
        end
      end
    end
