- id: blank-line-in-a-block-in-a-method-is-the-method-cops
  cop: Kata/NoEmptyLinesInBlocks
  expect: clean
  source: |
    # frozen_string_literal: true

    module Shelf
      class Expiration
        def expire(items)
          items.map do |item|
            item.close

            item.name
          end
        end
      end
    end
- id: value-cache-on-the-class-is-no-singleton
  cop: Kata/NoSingleton
  expect: clean
  source: |
    # frozen_string_literal: true

    module Shelf
      class Country
        def self.all = @all ||= Codelist.new(type: "countries").map { new(it) }
      end
    end
