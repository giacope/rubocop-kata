notes:
  Actor: a person who acts (doer), or the actor model's unit of concurrency (thing)
  Author: the noun came first; "to author" is a back-formation, so no -or suffix
  Buffer: the dominant sense is a storage area or cushion, not one who buffs
  Container: literally that which contains, but in code a box (thing)
  Counter: a shop counter (thing), or a tally that counts (doer)
  Creditor: one to whom money is owed, not one who credits
  Customer: from "custom" (patronage), not a verb
  Delimiter: that which delimits, but in code a character (thing)
  Doctor: Latin "teacher"; no English verb "doct"
  Drawer: a sliding box (thing), or one who draws (doer)
  Error: from Latin errare; "err" is a verb but an error is no agent of it
  Filter: the noun came first (felt); the verb is denominal
  Folder: the folded cover, the patient of folding, not its agent
  Footer: a page footer, not one who foots
  Header: a heading line, not one who heads
  Identifier: that which identifies, but in code a name (thing)
  Indicator: a gauge (thing), or that which indicates (doer)
  Layer: a thickness; "a hen that lays" is a rare sense
  Locker: a cupboard (thing), or one who locks (doer)
  Marker: a pen or a sentinel value (thing), or one who marks (doer)
  Matter: substance, not one who mats
  Meter: a unit of length (thing), sometimes a measuring device
  Modifier: a grammatical word (thing), or that which modifies (doer)
  Monitor: a screen (thing), or that which watches (doer)
  Number: an amount, not one who numbs
  Offer: same-form noun of the verb, no suffix
  Operator: a symbol (thing), or one who operates (doer)
  Order: same-form noun of the verb, no suffix
  Placeholder: a stand-in value (thing), or that which holds a place (doer)
  Planner: a diary (thing), or one who plans (doer)
  Pointer: an address value (thing), or that which points (doer)
  Poster: a printed sheet (thing), or one who posts (doer)
  Qualifier: a grammatical word (thing), or one who qualifies (doer)
  Register: from Latin registrum; a record or a CPU slot
  Reminder: a message (thing), or that which reminds (doer)
  Sensor: a device (thing), or that which senses (doer)
  Separator: a character (thing), or that which separates (doer)
  Server: a machine (thing), or that which serves (doer)
  Slider: a UI control (thing), or one who slides (doer)
  Spinner: a UI control (thing), or one who spins (doer)
  Sticker: a label (thing), or one who sticks (doer)
  Successor: the next in order (thing), or one who succeeds (doer)
  Trailer: a vehicle or a preview (thing), or one who trails (doer)
  Transfer: same-form noun of the verb, no suffix
  Trigger: from Dutch trekker; the noun came first
  Volunteer: the noun came first; the verb is denominal
  Frobnicator: a coinage, scored as the doer its suffix says
  Unmarshaler: a coinage, scored as the doer its suffix says
  Upserter: a coinage, scored as the doer its suffix says
