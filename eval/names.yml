# Class names ending in -er, -or or -ar, labelled for Kata/GoodClassName's
# doer rule. Written before the rule was changed, and not edited to fit it.
#
# doer  - the word's dominant sense is "one, or that, which <verb>s" for an
#         English verb: Parser parses, Timer times, User uses. People are
#         doers too (User, Buyer); a domain may still want them, which is
#         policy (AllowedNames), not linguistics. `roles` marks them.
# thing - the dominant sense is not the agent of a verb: the ending is not the
#         suffix (Number, Water, Corner), or the agent sense is rare or lost
#         (Layer is a thickness before it is a hen; Header is a heading;
#         Folder is the folded cover, the patient, not the agent).
# ambiguous - both readings are common in code; scored apart, never in
#         precision or recall. `notes` gives the reason.
#
# A name whose CRC32 is divisible by 3 is held out: the tuning loop prints
# per-name errors for the dev split only, and the holdout is read once.
