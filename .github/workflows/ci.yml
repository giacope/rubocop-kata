name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest releases
            rubocop: ">= 0"
            elegant: ">= 0"
          - name: oldest the gemspec allows
            rubocop: "1.75.1"
            elegant: "0.7.1"
    name: test (${{ matrix.name }})
    env:
      RUBOCOP_VERSION: ${{ matrix.rubocop }}
      RUBOCOP_ELEGANT_VERSION: ${{ matrix.elegant }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rspec
      - run: bundle exec hashira --ratchet

  eval:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_ELEGANT_VERSION: "0.8.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: eval/run --kata . --only settings,cases,names,cli --out tmp/eval/ci.json --gate
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
          LANG: C.UTF-8
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scoreboard
          path: tmp/eval/ci.*

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec kimera ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kimera-report
          path: tmp/kimera/report.json
