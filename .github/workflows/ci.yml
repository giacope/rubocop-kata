name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest releases
            rubocop: ">= 0"
            elegant: ">= 0"
          - name: oldest the gemspec allows
            rubocop: "1.75.1"
            elegant: "0.7.1"
    name: test (${{ matrix.name }})
    env:
      RUBOCOP_VERSION: ${{ matrix.rubocop }}
      RUBOCOP_ELEGANT_VERSION: ${{ matrix.elegant }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rspec
      # Every kind hashira checks by default; `--fail-on all` once hashira main has it.
      - run: >-
          bundle exec hashira --fail-on
          cycle,dead_code,roll_call,sdp_violation,layer_violation,mixed_audience,bidirectional_association,wide_edge,complexity,duplication,fragmentation,indirection,smells

  eval:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_ELEGANT_VERSION: "0.8.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: eval/run --kata . --only settings,cases,names,cli --out tmp/eval/ci.json --gate
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
          LANG: C.UTF-8
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scoreboard
          path: tmp/eval/ci.*

  # The PR gate: no surviving or uncovered mutant on the lines a pull request changes.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec kimera ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kimera-report
          path: tmp/kimera/report.json

  # The full run: every mutant in lib/, gated by .kimera.yml (no survivor, no
  # uncovered mutant, nothing ignored).
  mutation-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec kimera run --judge-isolated-only
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimera-full-report
          path: tmp/kimera/report.json
