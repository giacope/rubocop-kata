plugins:
  - rubocop-elegant
  - rubocop-rspec
  - rubocop-performance
  - rubocop-packaging
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "db/*schema.rb"

Kata/GoodClassName:
  Description: >-
    A class names one object that exists in the model. Three shapes hide that
    object: a doer name (`-er`/`-or`), a junk-drawer name (`Service`, `Util`,
    `Data`), and a name packing several concepts (`CustomerOrderPayment`).
    Compound syntax is not the smell — `CreditCard` is one concept, and belongs
    in `Terms`. A doer is an agent noun: the shipped WordNet data says whether
    a word's dominant sense is "one that <verb>s" (`Parser`, `Timer`) or a
    thing (`Number`, `Header`, `Order`), and an unknown word is a doer when its
    stem is a verb. A trailing `Suffixes` word names what the class is for
    (`UsersControllerTest` is for `UsersController`). `ContractSuffixes` are
    the words a framework resolves a class by (`UsersController`,
    `EmailValidator`, `InviteMailer`); the framework dictates the suffix, not
    the subject, so `UsersControllerTest` is judged as `Users`, and
    `ReportGeneratorJob` as `ReportGenerator`. A class whose superclass ends in the same word inherits that word
    (`ActionHandler < Avo::Actions::ActionHandler`, `AuditLogger < Logger`):
    the doer, if any, is the parent. `AllowedNames` match a whole name or a
    trailing segment: exception classes (`Error`), the domain roles a model
    represents rather than performs (`User`, `Owner`), words whose thing and
    doer readings are equally common in code (`Server`, `Container`), and
    `Header`, which WordNet derives from the verb `head`.
  Enabled: true
  VersionAdded: "0.9"
  VersionChanged: "0.11"
  Exclude:
    - "db/*migrate/**/*"
  MaxWords: 2
  Suffixes:
    - Test
    - TestCase
    - Spec
    - Preview
  ContractSuffixes:
    - Adapter
    - Channel
    - Component
    - Controller
    - Decorator
    - Generator
    - Job
    - Mailbox
    - Mailer
    - Policy
    - Serializer
    - Task
    - Validator
  AllowedNames: &type_names
    - Actor
    - Container
    - Error
    - Header
    - Owner
    - Server
    - Supplier
    - User
    - Vendor
  BannedNames:
    - Util
    - Utils
    - Utility
    - Utilities
    - Service
    - Data
    - Info
    - Misc
  Terms:
    - AbstractSyntaxTree
    - BillOfLading
    - BinarySearchTree
    - HashWithIndifferentAccess
    - JsonWebToken
    - OneTimePassword
    - RedBlackTree
    - StockKeepingUnit
    - TimeWithZone
    - UnitOfWork

Kata/GoodModuleName:
  Description: >-
    A module names a domain vocabulary or boundary, not an implementation
    category. Layer buckets (`Services`, `Helpers`, `Logic`), vague shared
    namespaces (`Common`, `Shared`, `Core`), doer names, and names packing
    several concepts are flagged; a genuine compound domain like
    `AccessControl` passes. `BannedNames` matches a whole name or a trailing
    segment, so `Services` also catches `ApplicationServices`. `ContractSuffixes`
    hold the words a framework resolves a module by: Rails includes
    `app/helpers/invoices_helper.rb` as `InvoicesHelper`, and a reopen of
    `ActionController` must spell it exactly. Reopening another library's
    junk drawer (`FileUtils`) is a file-boundary `Exclude`, not a naming
    choice. `AllowedNames` is the class list. Absorbs the module half of
    Kata/NoUtilName.
  Enabled: true
  VersionAdded: "0.9"
  VersionChanged: "0.11"
  MaxWords: 2
  ContractSuffixes:
    - Controller
    - Helper
    - Mailer
  AllowedNames: *type_names
  BannedNames:
    - Common
    - Core
    - Decorators
    - Extensions
    - Forms
    - Helpers
    - Jobs
    - Logic
    - Managers
    - Misc
    - Mixins
    - Models
    - Policies
    - Presenters
    - Queries
    - Serializers
    - Service
    - Services
    - Shared
    - Util
    - Utilities
    - Utility
    - Utils
    - Validators
    - Workers
  Terms: []

Kata/NoComments:
  Description: >-
    Say it in the code; keep only what the code cannot say. Code can say what
    and how; it cannot cite an external constraint, and a tool cannot read
    prose. So the cop keeps magic comments and editor modelines (deleting
    `# -*- coding: binary -*-` changes every string literal), tool directives
    (RuboCop, Standard, SimpleCov, Steep `@type`, RBS `#:` and `@rbs`, Sorbet,
    reek `:reek:`, kimera, hashira, RubyMine `language=`), RDoc and YARD
    directives, licence headers, every comment block that cites a URL, an
    issue or pull request (`rails/rails#123`, `#123`), an RFC or a CVE, and
    every block carrying a YARD tag: a gem's API documentation is product, not
    prose (`AllowDocumentation: false` to price it too). `AllowedPatterns`
    adds the directives of tools it does not know. Removing a comment loses
    what it said, so the correction is unsafe: `rubocop -A` applies it,
    `rubocop -a` does not. `config/` is excluded: its comments are the
    framework's generated guidance.
  Enabled: true
  VersionAdded: "0.1"
  VersionChanged: "0.11"
  SafeAutoCorrect: false
  AllowDocumentation: true
  AllowCitations: true
  AllowedPatterns: []
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "config/**/*"
    - "config.ru"
    - "*.gemspec"
    - "Gemfile"
    - "**/Gemfile"

Kata/GoodMethodName:
  Description: >-
    One word per method name. A second word is allowed only when it does not
    hide a missing object: a role prefix (`after_fork`), a role suffix
    (`file_of`), or a reviewed domain term. A name that chains actions
    (`validate_and_save`) or spells out another object's property
    (`customer_address`) is a missing method home, not a naming problem.
    Do not delete the underscore — Kata/RealWords catches the smash. A
    Minitest `test_` method in a test class is a sentence, like an RSpec
    description, and goes unpriced.
