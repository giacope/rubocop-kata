  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_test.rb"

# Method size is bounded by logic density, not lines. A five-line limit
# fragmented code: in a blind readability study (eval/results/README.md),
# code written to it averaged about 3 lines a method and readers judged half
# of it over-fragmented, against almost none of the control. So the length
# limit goes back to RuboCop's 10 and the complexity cops do the guarding at
# RuboCop's defaults, from Elegant's 50 and 15: AbcSize 17,
# CyclomaticComplexity 7, PerceivedComplexity 8. A wrapped call still counts
# as one line, since Kata/PairedBrackets puts each argument on its own line;
# AbcSize prices what such a call carries.
Metrics/AbcSize:
  Max: 17

Metrics/CyclomaticComplexity:
  Max: 7

Metrics/PerceivedComplexity:
  Max: 8

Metrics/MethodLength:
