Kata/NoSetter:
  Description: >-
    An object takes its state in the constructor and keeps it: `attr_writer`,
    `attr_accessor` and a `def name=` method each let a caller change it
    afterwards. Return a new object instead (`with_name`). `[]=` is a
    collection's protocol, not a setter, and is not reported.
  Enabled: true
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "**/*.jbuilder"

Kata/FrozenState:
  Description: >-
    An instance variable is assigned in `initialize` (or `initialize_copy`,
    or a helper only those call) and never again. Memoization is not a
    change of state: `@x ||= ...`, `@x = ... unless @x`, `@x = ... if
    @x.nil?`, `@x = @x || ...` and `return @x if defined?(@x)` pass. A hook
    a superclass's `initialize` calls (`setup`) is construction too: the cop
    follows the methods any `initialize` calls, transitively, through the
    class's superclasses, subclasses and mixins anywhere under `OwnedPaths`
    (liquid's `Tag#initialize` → `ParserSwitching` → `If#strict_parse`,
    concurrent-ruby's `IVar#initialize` → `Promise#ns_initialize`), and
    `ConstructorHooks` names the hooks a framework calls after `new`; an
    entry `Owner#hook` holds only for a class descending from `Owner`
    (Arbre's components are built by `build`). Changing what an instance
    variable holds is changing state too: `@items << item`, `@index[key] =
    value` and the other `MutatingMethods` of Kata/NoOutputArgument, outside
    construction, are offenses; a keyed cache (`@cache[key] ||= value`) is
    memoization.
    Rails hands a view its data through a controller's or mailer's instance
    variables, so `app/controllers`, `app/mailers` and `app/helpers` are
    excluded.
  Enabled: true
  Sorbet: false
  VersionAdded: "0.11"
  ConstructorHooks: []
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "app/controllers/**/*"
    - "*/app/controllers/**/*"
    - "app/mailers/**/*"
    - "*/app/mailers/**/*"
    - "app/helpers/**/*"
    - "*/app/helpers/**/*"
    - "app/views/**/*"
    - "*/app/views/**/*"
    - "**/*.jbuilder"

Kata/NoOutputArgument:
  Description: >-
    A method does not change the objects it was handed: `items << x`,
    `options.delete(:key)`, `headers[k] = v` and the other `MutatingMethods`
    on a parameter reach back into the caller. Return a new value, or move
    the change to the object that owns the data. Only the method's own
    positional and keyword parameters count; a splat (`*args`, `**options`)
    is a fresh collection, and a parameter reassigned first (`list =
    list.dup`) is a copy. `AllowedNames` holds the parameters that are sinks
    by convention, written to rather than returned (`io`, `out`, `buffer`),
    and `env`, which Rack and Faraday middleware is contracted to change.
  Enabled: true
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "**/*.jbuilder"
  AllowedNames:
    - buffer
    - env
    - io
    - out
    - output
    - stderr
    - stdout
    - stream
    - yielder
  MutatingMethods:
    - "<<"
    - "[]="
    - append
    - clear
    - collect!
    - compact!
    - concat
    - delete
    - delete_if
    - fill
    - filter!
    - flatten!
    - gsub!
    - insert
    - keep_if
    - map!
    - merge!
    - pop
    - prepend
    - push
    - reject!
    - replace
    - reverse!
    - rotate!
    - select!
    - shift
    - shuffle!
    - slice!
    - sort!
    - sort_by!
    - store
    - sub!
    - transform_keys!
    - transform_values!
    - uniq!
    - unshift
    - update

Kata/CommandQuery:
  Description: >-
    A method whose name ends in `?` answers a question and changes nothing:
    it assigns no instance variable and calls no `!` method on itself, its
    state or its parameters. Memoizing the answer (`@valid ||= ...`) is not a
    change, and neither is a guard whose only branch is a bang on a constant
    (`UI.user_error!("...") unless key`): it raises, it does not mutate.
  Enabled: true
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "**/*.jbuilder"

Kata/NoTypeCheck:
  Description: >-
    `is_a?`, `kind_of?`, `instance_of?` and `respond_to?` ask an object what
    it is so the caller can decide what to do; polymorphism lets the object
    decide. The boot layer and the protocols that compare or convert values
    are exempt: `AllowedMethods` holds `==`, `eql?`, `<=>`, `===`, `coerce`
    and `respond_to_missing?`, whose contract is to accept any object and
    check what it was handed. Only the project's own types are judged: a
    check against a class or module the project defines (in the file, or in
    `OwnedPaths`; a constant assigned `Class.new`, `Module.new`, `Struct.new`
    or `Data.define` counts), or a `respond_to?` probe for a method the
    project defines. A type ladder in any spelling is the same question:
    `case x when Circle`, `case x in Circle`, `Circle === x`,
    `x.class == Circle` and `x.class.name == "Circle"`.
    A name is resolved as Ruby resolves it, through the lexical nesting, and
    is the project's only when the project defines that fully qualified name
    with a body: `ActiveJob::Base` is not the project's because it reopens
    `module ActiveJob` around its own adapter, or names another class `Base`.
    The project's own definitions win over the core inventory, so a project
    that is a default gem (rubygems' `Gem::Source`) is judged on its own
    namespace, while reopening a core class (`class String`) is not owning it.
    A check against a class another library owns (an AST node, `String`) is
    the boundary where foreign data comes in, which polymorphism cannot
    reach, and is left alone; so are the conversion and iteration protocols
    (`respond_to?(:to_h)`, `:each`, `:call`) and any `respond_to?` probe of
    a method a public class of `Protocols` answers: Ruby's core and standard
    library, and Rails' frameworks in the Rails profile or for a library
    whose gemspec depends on ActiveRecord, ActiveModel or ActiveSupport
    (data/protocols). A `respond_to?(:m)` probe is about the project's types
    only when one of its own classes defines `m` publicly (a private helper
    never answers it; `respond_to?(:m, true)` asks for private ones too) and
    the receiver is not another library's constant (pundit's
    `::RSpec.respond_to?(:current_example)`) nor a literal, a core object
    (action_policy's `"".respond_to?(:safe_constantize)`); a method defined
    in `refine String do` belongs to `String`, and no object answers
    `respond_to?` for a refinement. A namespace one of the
    `Dependencies` is named for (kata fills them from the Gemfile, the
    lockfile and the gemspecs: rack owns `Rack`, rack-test `Rack::Test`)
    stays the dependency's however the project reopens it, unless the
    project's own root sits inside it (`RuboCop::Kata` in `RuboCop`).
  Enabled: true
  VersionAdded: "0.11"
  VersionChanged: "0.11"
  Dependencies: []
  Protocols:
    - ruby
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  AllowedMethods:
    - "=="
    - "!="
    - "<=>"
    - "==="
    - coerce
    - eql?
    - equal?
    - method_missing
    - respond_to_missing?
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/**/*"
    - "bin/**/*"
    - "exe/**/*"
    - "script/**/*"
    - "config/**/*"
    - "config.ru"
    - "lib/tasks/**/*"
    - "Rakefile"
    - "**/*.rake"
    - "*.gemspec"
    - "Gemfile"
    - "**/Gemfile"
    - "gems.rb"
    - "**/*.jbuilder"

Kata/NoSingleton:
  Description: >-
    A singleton is a global with a class name: `include Singleton`, or a
    class method caching an instance in a class-level variable
    (`def self.instance = @instance ||= new`). Build the object where the
    program starts and pass it to what needs it. The cache is judged by
    what it holds, the value its expression returns: a class-level cache of
    a value (`@members ||= Set.new(...)`, a `Struct.new`, a `Pathname`, or
    `Codelist.new(...).map { ... }`, an array) is not an instance of the
    class's service, and `AllowedConstructors` lists those classes.
  Enabled: true
  VersionAdded: "0.11"
  AllowedConstructors:
    - Array
    - Class
    - Concurrent::Map
    - Data
    - Hash
    - Module
    - Monitor
    - Mutex
    - Pathname
    - Queue
    - Regexp
    - Set
    - String
    - Struct
    - Thread::Mutex
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "**/*.jbuilder"

Style/Documentation:
  Enabled: false

# A gemspec, Gemfile or Rakefile often reads VERSION with a regexp written for
# the quotes the file has (concurrent-ruby's `[/'(.+)'/, 1] or raise`), so
# requoting a version file breaks the build, not the program.
Style/StringLiterals:
  EnforcedStyle: double_quotes
  Exclude:
    - "**/version.rb"

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/ItBlockParameter:
  Enabled: true
  EnforcedStyle: only_numbered_parameters

# RuboCop's spec helpers read `%{name}` as their own template (`expect_offense`
# fills it from keyword arguments); it is not a format string.
Style/FormatStringToken:
  EnforcedStyle: unannotated
  AllowedMethods:
    - expect_offense
    - expect_correction
    - expect_no_offenses

Style/EndlessMethod:
  Enabled: true
  EnforcedStyle: allow_single_line

# `error` is a word; `e` is a clipping Kata/RealWords would reject. RuboCop
# renames the variable inside the rescue clause only, so an `ensure` or a
# later line that reads `e` breaks, and an outer `error` local is
# overwritten (Sequel lost 350 tests to it). It reports; a person renames.
Naming/RescuedExceptionsVariableName:
  PreferredName: error
  AutoCorrect: false

# Memoization caches are marked with a leading underscore (@_name), so lazy
# state is visible at the read site; Kata/GoodVariableName knows the
# same @_word shape. The correction renames the ivar in the memoizing method
# only, and every other reader keeps the old name: `rubocop -A` broke 25 of
# faraday's specs that way. It reports; a person renames.
Naming/MemoizedInstanceVariableName:
  EnforcedStyleForLeadingUnderscores: required
  AutoCorrect: false

# Kata owns naming now; the upstream cops force strictly one word, which is
# what drives the underscore-smashing dodge.
Elegant/GoodMethodName:
  Enabled: false

Elegant/GoodVariableName:
  Enabled: false

Layout/LineLength:
  Max: 120

# `#: (String) -> void` is an RBS inline signature and `#$ type` a Steep
# annotation; Kata/NoComments keeps both as tool directives, so the space
# this cop would insert turns a signature into prose.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
  AllowSteepAnnotation: true

Layout/LineEndStringConcatenationIndentation:
  Enabled: true
  EnforcedStyle: indented

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "*.gemspec"

Metrics/ClassLength:
  Max: 100
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_test.rb"

Metrics/ModuleLength:
  Max: 100
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_test.rb"

# Method size is bounded by logic density, not lines. A five-line limit
# fragmented code: in a blind readability study (eval/results/README.md),
# code written to it averaged about 3 lines a method and readers judged half
# of it over-fragmented, against almost none of the control. So the length
# limit goes back to RuboCop's 10 and the complexity cops do the guarding at
# RuboCop's defaults, from Elegant's 50 and 15: AbcSize 17,
# CyclomaticComplexity 7, PerceivedComplexity 8. A wrapped call still counts
# as one line, since Kata/PairedBrackets puts each argument on its own line;
# AbcSize prices what such a call carries.
Metrics/AbcSize:
  Max: 17

Metrics/CyclomaticComplexity:
  Max: 7

Metrics/PerceivedComplexity:
  Max: 8

Metrics/MethodLength:
  Max: 10
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
  Exclude:
    - "spec/**/*"
    - "test/**/*"

Metrics/ParameterLists:
  Enabled: true
  Max: 4
  CountKeywordArgs: true
  Exclude:
    - "spec/**/*"
    - "test/**/*"

# Counted the way Metrics/MethodLength counts a method.
RSpec/ExampleLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

RSpec/VerifiedDoubles:
  Enabled: true

# Elegant's blank-line cops delete every blank line in a method or block,
# including the lines of a heredoc or a multi-line string inside it, which
# changes the string (a message's paragraph breaks, a generated script). Kata
# ships fixed copies that leave literal text alone; the originals are off.
Elegant/NoEmptyLinesInBlocks:
  Enabled: false

Elegant/NoEmptyLinesInMethods:
  Enabled: false

# RSpec's blank-line cops reach every file under a `spec/` folder at any depth
# (an engine's, a monorepo gem's), so these stand down on the same files, or
# the two autocorrect in a loop.
Kata/NoEmptyLinesInBlocks:
  Description: >-
    A block, a conditional or a loop holds no blank line: the next thought
    belongs in its own method. Blank lines inside a heredoc or a multi-line
    string are text, not layout, and are left alone. Fixed copy of
    `Elegant/NoEmptyLinesInBlocks`.
  Enabled: true
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/spec/**/*"
    - "**/test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "**/*.jbuilder"

Kata/NoEmptyLinesInMethods:
  Description: >-
    A method body holds no blank line: a method that needs one is two
    methods. Blank lines inside a heredoc or a multi-line string are text, not
    layout, and are left alone. Fixed copy of `Elegant/NoEmptyLinesInMethods`.
  Enabled: true
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/spec/**/*"
    - "**/test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "**/*.jbuilder"

Elegant/NoComments:
  Enabled: false

Style/MethodCallWithArgsParentheses:
  Enabled: false

# --- Core layout cops. Kata/PairedBrackets now corrects to the indent these
# expect, so the cops that only fought its drift are on, each in the style
# that agrees with Elegant/MonotonicIndents (a fixed two-space step). Run one
# at a time with `rubocop -A` over faraday and rubygems.org, none loops or
# leaves an offense behind. The five below stay off: each wants a blank line
# where Elegant/NoEmptyLinesInBlocks or NoEmptyLinesInMethods forbids one,
# and `rubocop -A` reports infinite loops on them (382 on rubygems.org for
# the guard clause alone; EmptyLineBetweenDefs loops wherever two defs sit
# in a block or a method body, as `Class.new do`, `included do` and
# `module_exec` bodies do).
Layout/BlockAlignment:
  Enabled: true
  EnforcedStyleAlignWith: start_of_line

Layout/MultilineBlockLayout:
  Enabled: true

Layout/ClosingParenthesisIndentation:
  Enabled: true

Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/MultilineMethodCallBraceLayout:
  Enabled: true

Layout/MultilineArrayBraceLayout:
  Enabled: true

# Under rubocop-elegant's `Layout/ArrayAlignment: with_fixed_indentation` this
# cop checks nothing in its default style, so no cop placed a `]` that starts
# a `].compact` line, and `-a` left one where a merged pass had shifted its
# `[` (searchkick's `@index_name ||= begin [...].compact.join("_") end`).
# `consistent` indents the elements one step from the line of the `[` and
# puts the `]` at that line's indent, as Kata/PairedBrackets does.
Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineHashBraceLayout:
  Enabled: true

Layout/MultilineMethodCallIndentation:
  Enabled: true
  EnforcedStyle: indented

Layout/ParameterAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/RescueEnsureAlignment:
  Enabled: true

# Its default aligns continuation arguments under the first argument's column,
# an arbitrary step Elegant/MonotonicIndents rejects; a fixed step is +2.
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

# Neither of its styles agrees with Elegant/MonotonicIndents in a condition:
# `aligned` puts the continuation of a multi-line `if` condition under its
# first operand (3 columns in, 6 after `elsif`), `indented` 4 columns in, so
# every layout of such a condition broke one rule or the other, and `-a`
# walked a clean `if (\n a ||\n b\n)` into the conflict. MonotonicIndents
# keeps a continued operation to the two-space step.
Layout/MultilineOperationIndentation:
  Enabled: false

Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: false

Layout/EmptyLinesAroundAccessModifier:
  Enabled: false

Layout/EmptyLinesAfterModuleInclusion:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

# --- An inline disable is the only escape short of excluding a whole file,
# so it stays, priced: Kata/JustifiedDirective wants the reason after `--`,
# and `rubocop-kata doctor` lists every one with its reason.
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: false

Kata/JustifiedDirective:
  Description: >-
    An inline `rubocop:disable` says why, after `--`, in at least `MinWords`
    words, and so does every other directive that turns a cop off:
    `disable-next-line`, `disable-next`, `todo`, `todo-next`, and a `push` or
    `next` with a `-Cop`. A false positive then costs one reviewed line instead of a
    per-file `Exclude` that hides every later offense in the file. A
    `disable all` silences this cop too, on its own line; `rubocop-kata
    doctor` lists it with the rest.
  Enabled: true
  VersionAdded: "0.11"
  MinWords: 3

# --- Three Elegant cops ship here as Kata/*, fixed (see README); the
# originals are off so an offence is reported once.
Elegant/NoRedundantVariable:
  Enabled: false

Elegant/PairedBrackets:
  Enabled: false

Elegant/ClassInModule:
  Enabled: false

Kata/NoRedundantVariable:
  Description: >-
    A local assigned once and read once is inlined at its read when its name
    says nothing its value does not: the value is a literal or a bare read,
    the name is a letter or a generic word (`result`, `value`), or the
    expression already spells it (`user = User.find(id)`). A name that adds
    a word explains the value (`subtotal = [...].max`), as Clean Code asks of
    an explanatory variable, and stays. A value that spans several lines (a
    heredoc's too) is a step with a name, and so is a regexp under a name
    that says what it matches; both stay, and so does a local whose inlining
    would push its line past Layout/LineLength.
  Enabled: true
  Sorbet: false
  VersionAdded: "0.10"
  VersionChanged: "0.11"

Kata/PairedBrackets:
  Description: "A bracket pairs on its line, or opens at the end of one and closes at the start of another."
  Enabled: true
  VersionAdded: "0.10"

Kata/ClassInModule:
  Description: >-
    A class lives in a module, a class, or a compact namespace, never at the
    top level. A file directly in a Zeitwerk root (`app/models/account.rb`,
    `app/models/concerns/archivable.rb`, and `lib/*.rb` when
    config/application.rb autoloads lib/ through `config.autoload_lib` or
    its autoload or eager-load paths) defines a top-level constant by
    design, so those are excluded; a subdirectory of a root is a namespace,
    and Zeitwerk already demands the matching module. A migration
    (`class CreateSlugs < ActiveRecord::Migration[7.1]`, or under a constant
    the file assigns one) is loaded the same way wherever its template lives:
    ActiveRecord loads the file and constantizes the top-level name camelized
    from it, so a module around it makes `db:migrate` raise. Reopening one of
    the `CoreClasses` (`class String`) is a monkey patch: wrapping it in a
    module would define a new class, so the message asks for a refinement or
    a decorator instead. The project's own root constant (`class Roda` in the
    roda gem, from the gemspec's name or the Rails application's module, in
    the `Kata` department's `Roots`) is its one top-level name and passes. A
    class reopened in several files is one decision, judged once: in the
    file named for it, else in its opening with the most statements, among
    the files `OwnedPaths` matches.
  Enabled: true
  VersionAdded: "0.10"
  VersionChanged: "0.11"
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  CoreClasses:
    - Array
    - BasicObject
    - BigDecimal
    - Class
    - Complex
    - Data
    - Date
    - DateTime
    - Dir
    - Exception
    - FalseClass
    - File
    - Float
    - Hash
    - Integer
    - IO
    - MatchData
    - Method
    - Module
    - NilClass
    - Numeric
    - Object
    - OpenStruct
    - Pathname
    - Proc
    - Range
    - Rational
    - Regexp
    - Set
    - StandardError
    - String
    - Struct
    - Symbol
    - Thread
    - Time
    - TrueClass
  Exclude:
    - "app/*/*.rb"
    - "*/app/*/*.rb"
    - "app/*/concerns/*.rb"
    - "*/app/*/concerns/*.rb"
    - "**/*_test.rb"
    - "test/**/*"
    - "spec/**/*"
    - "db/*migrate/**/*"
    - "**/*.jbuilder"

# Rewrites reopened classes into modules, clashing with the primary
# class definition at boot.
Style/StaticClass:
  AutoCorrect: false

# Deletes `print x` from `print x if cond` and leaves the modifier behind,
# which does not parse.
RSpec/Output:
  Enabled: true
  AutoCorrect: false

# Its message names a replacement that raises: Integer(x, 10) is only
# valid when x is a String, and most `.to_i` receivers are not.
Lint/NumberConversion:
  Enabled: false

# Alphabetizing requires breaks load-order-dependent boot sequences.
Style/RequireOrder:
  Enabled: false

# `Proc.new` -> `proc` calls Kernel#proc, which a BasicObject subclass does
# not have (Sequel's migration reverser).
Style/Proc:
  SafeAutoCorrect: false

# Each of these broke a Sequel or ruby-lsp file under plain `rubocop -a`:
# the endless and compact rewrites drop the parentheses of
# `def (@m.db).name() false end`; `lambda{|| 1}` becomes `->{|| 1}`;
# `def name() super.merge(` loses its parentheses once Layout/LineLength has
# split the line; Sequel's `dataset.bind(n: 1).call(:all)` is no
# UnboundMethod; `Array === proxy` becomes `proxy.is_a?(Array)`, which a
# delegating proxy answers for its target; and `Sequel.**(1)` builds SQL, so
# dropping the `** 1` changes the query. They run under -A.
Style/SingleLineMethods:
  SafeAutoCorrect: false

Style/EmptyMethod:
  SafeAutoCorrect: false

Style/CaseEquality:
  SafeAutoCorrect: false

Style/Lambda:
  SafeAutoCorrect: false

Style/DefWithParentheses:
  SafeAutoCorrect: false

Performance/BindCall:
  SafeAutoCorrect: false

# Each of these changed what code does under plain `rubocop -a` in the second
# field test. The first three swap a name for its "equivalent" without asking
# whether the project defines that name: `sprintf` -> `format` calls a
# formatter's own `#format` (rouge), `yield_self` -> `then` calls a Result's
# own `#then`, which runs only on success (steep), and `TRUE` -> `true`
# replaces a class's own constant (steep); the last two are marked where the
# pending cops are enabled, below. Lint/AmbiguousRegexpLiteral drops the
# opening paren of `puts /a/.match?(x) ? 1 : 2`, which no longer parses
# (vita-min).
Style/FormatString:
  SafeAutoCorrect: false

Lint/AmbiguousRegexpLiteral:
  SafeAutoCorrect: false

# Raises FrozenError inspecting `require File.dirname(__FILE__) + "/x"` in a
# file with the frozen-string-literal comment Style/FrozenStringLiteralComment
# adds (rubocop-packaging 0.6.0).
Packaging/RequireHardcodingLib:
  Enabled: false

ThreadSafety/DirChdir:
