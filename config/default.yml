Kata/NoNilArgument:
  Description: >-
    A parameter that defaults to nil, which the method then asks about
    (`coupon.nil?`, `coupon&.cents`, `coupon || NONE`, `if coupon`), is two
    methods in one: the caller who has the value and the caller who does not.
    Split them, or default to a null object that answers the same messages. A
    constructor's nil default kept in a field the class asks about the same
    way (`@referrer.nil?`) is two objects in one. A nil default that the
    method only passes on (`fetch(key, default = nil)`) is the callee's
    business, and the protocols whose signature Ruby or Rails dictates
    (`as_json(options = nil)`) are in `AllowedMethods`. Off by default:
    config/strict.yml turns it on.
  Enabled: false
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/*migrate/**/*"
  AllowedMethods:
    - as_json
    - method_missing
    - respond_to_missing?
    - serializable_hash
    - to_json
    - to_xml

Kata/NoNilReturn:
  Description: >-
    A method never returns nil, on any code path: not a literal `nil` or
    `return nil`, not the nil a lookup passes on (`detect`, `find` with a
    block, `find_by`, `first`, `last`, `min`, `max`, `sample`, `[]`, `dig`,
    `match`, `index`, `presence`, `try`, `&.`), and not the missing branch of
    an `if`, `unless` or `case` whose other branches answer with a value
    (`@items[code] if @open`). Return a null object, or fail fast (`fetch`).
    The `min` or `max` of an array literal that holds a number, a string, a
    symbol or a constant the file assigns one (`[cost, LIMIT].min`) answers
    one of its elements, never nil (a nil element raises). A block's
    literal `nil` is reported too. A predicate's falsy nil answers its
    question, a writer's value is its argument, and a method that forwards the
    protocol it is named after (`def first = @rows.first`) keeps that
    protocol's contract; `AllowedMethods` holds the core methods whose
    contract answers nil, so an override that answers nil keeps it and a
    null object or a raise would break Ruby's own readers: `[]` and `dig`
    (no such key), `method_missing`, `<=>` (incomparable: `sort`, `max` and
    `Comparable` turn it into their own error, where a null 0 would claim
    equality), `=~` (no match), `cause` (the end of an exception's cause
    chain, where every walker stops), `backtrace` and `backtrace_locations`
    (not raised yet), `to_ary` (no implicit conversion: `flatten` and
    multiple assignment go on), and `gets` (end of the stream). The same
    list passes `Elegant/NoNilReturn`. Off by default: config/strict.yml
    turns it on in place of `Elegant/NoNilReturn`, which sees only the
    literal `nil`.
  Enabled: false
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/*migrate/**/*"
  AllowedMethods: &nil_answers
    - "<=>"
    - "=~"
    - "[]"
    - backtrace
    - backtrace_locations
    - cause
    - dig
    - gets
    - method_missing
    - to_ary

# An override of a core method whose contract answers nil keeps it (the
# list and the reasons are Kata/NoNilReturn's); kata reads this list for the
# bundled cop, which has no option of its own.
Elegant/NoNilReturn:
  AllowedMethods: *nil_answers

Kata/NoPublicConstant:
  Description: >-
    No public constants as shared values: reading another of the project's
    classes' or modules' value constant (`Cart::MAX_ITEMS`,
    `Settings::TAX_RATE`) couples the reader to the value and scatters the
    logic that interprets it. Ask the owner for what the value means
    (`cart.full?`) and make the constant private (`private_constant`). Only
    the project's own namespaces are judged (Ruby's `Float::INFINITY` and a
    library's constants are its API), a class reading its own constants
    passes, and `AllowedNames` holds the constants a packaging tool reads
    (`VERSION`). A class, module or error is not a value, and neither is a
    constant that namespaces another (`Net::NTLM::Message`, however its
    acronym is spelled). Off by default: config/strict.yml turns it on.
  Enabled: false
  VersionAdded: "0.11"
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  AllowedNames:
    - VERSION
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "*.gemspec"
    - "db/**/*"

Kata/NoReflection:
  Description: >-
    Reflection on another object is hidden coupling: reading or writing its
    fields (`@order.instance_variable_get(:@total)`), calling a method by a
    name written in the code (`@record.send(:token)`, usually to reach a
    private one), and building a constant's name at run time
    (`Object.const_get("Shop::#{kind}View")`, `"#{kind}View".constantize`) tie
    the caller to internals no interface names. Ask the object through a
    public method, or map the names to objects. Dispatch on a name the code is
    handed (`public_send(field)`) is a protocol; sent with `send` or
    `__send__` (`controller.send(@method)`) it reaches private methods too,
    and is reported with the advice to use `public_send`, except where
    `public_send` would raise: a computed name sent to a class or module
    the code treats as one (`@base.module_eval`, `private_method_defined?`
    on the same name), whose `private`, `module_function` and
    `remove_const` only reflection reaches, is told to let the class say it
    in its own body, or to decorate its objects instead of changing the
    class from outside; one the code looks up among the private methods
    (`respond_to?(name, true)`) is told to send a message the object
    answers in public. The forward inside an object's own `send` or
    `__send__` (a decorator that passes the protocol on) is that protocol,
    and passes. An object reflecting on itself and the boot layer pass. Off by default:
    config/strict.yml turns it on in place of `Style/Send`, whose advice
    (`__send__`) keeps the reflection; the `send` an object makes to itself,
    which `Style/Send` also reports, is not judged.
  Enabled: false
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/**/*"
    - "config/**/*"
    - "bin/**/*"
    - "exe/**/*"
    - "lib/tasks/**/*"
    - "**/*.rake"

Kata/FieldCount:
  Description: >-
    A class encapsulates at most `Max` fields (four by default, Elegant
    Objects' "encapsulate as little as possible"): the instance variables its
    instance methods assign, and the fields its `attr_*` macros name, counted
    once each. A memoized answer (`@total ||= ...`) is a cache, not a field,
    and stays one when a reset clears it (`@total = nil`). More fields than that is several objects in one; group some into an object
    of their own. Rails controllers, mailers, helpers and views, which hand
    views their data through instance variables, are not judged. Off by
    default: config/strict.yml turns it on.
  Enabled: false
  VersionAdded: "0.11"
  Max: 4
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/**/*"
    - "config/**/*"
    - "app/controllers/**/*"
    - "*/app/controllers/**/*"
    - "app/mailers/**/*"
    - "*/app/mailers/**/*"
    - "app/helpers/**/*"
    - "*/app/helpers/**/*"
    - "app/views/**/*"
    - "*/app/views/**/*"

Kata/PublicSurface:
  Description: >-
    A class exposes at most `Max` public instance methods (four by default,
    Elegant Objects' "fewer than five public methods"): its public `def`s and
    the methods its public `attr_*` macros mint. A short interface is a small
    object; more methods than that is several objects in one, so move some to
    an object of their own. The protocols Ruby dispatches to (`to_s`, `==`,
    `<=>`, `each`, `call`, `[]`, and the hooks Psych and Marshal call by name
    to dump and load an object: `encode_with`, `init_with`, `marshal_dump`,
    `marshal_load`, `_dump`; `Protocols`) and the callbacks a dispatcher
    names (RuboCop's and Prism's `on_*`; `AllowedPatterns`) are not counted.
    Rails controllers, whose actions are routes, mailers, helpers and views
    are not judged. Off by default: config/strict.yml turns it on.
