Kata/ProsePlacement:
  Description: "Keep sentence-length strings in the presentation layer."
  Enabled: false
  VersionAdded: "0.1"

Kata/RealWords:
  Description: >-
    Every name segment is a word: an English word, an initialism (`api`,
    `uuid`), a technology's name (`rspec`, `postgres`), or the platform's own
    spelling of the thing (`env` for Rack and `ENV`, `params`, `attr`, `dir`,
    `io`, `regexp`, `proc`, `stdout`, `mkdir`). `errorcount` is a smash and
    fails. A clipping of an English word fails wherever a dictionary lists it:
    `args`, `opts`, `src`, `cmd`, `impl`, `str`, `req`, `conn` are all spelled
    out, and the message names the word (`req` is `request`); `foo` and `qux`
    are placeholders. The shipped table is data/clippings.txt; `BannedWords`
    adds a project's own, `Terms` re-allows one as reviewed jargon, and
    `AllowedNames` exempts names a protocol dictates (`to_str`).
  Enabled: true
  VersionAdded: "0.5"
  VersionChanged: "0.11"
  BannedWords: []
  Terms: []
  AllowedNames:
    - to_ary
    - to_int
    - to_str
    - to_sym

Kata/BuilderNoun:
  Description: "Builders are named for what they return; verbs are for side effects."
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.7"
  BannedPrefixes:
    - get
    - calculate
    - compute
    - retrieve
    - generate
  AllowedNames: []

Kata/NoBooleanFlag:
  Description: >-
    A boolean flag is two methods trapped in one: at a call, and as a
    positional parameter's default. `AllowedMethods` holds the calls whose
    boolean is a protocol or a value rather than a flag — Ruby's reflection
    (`respond_to?(name, true)`), a default (`fetch(:ssl, false)`), a stored
    value (`instance_variable_set(:@done, false)`) — and the defs whose
    signature Ruby dictates (`respond_to_missing?`).
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/*migrate/**/*"
  AllowedMethods:
    - all?
    - any?
    - const_defined?
    - const_get
    - const_source_location
    - content_security_policy
    - exit
    - exit!
    - fetch
    - include?
    - instance_methods
    - instance_variable_set
    - layout
    - method_defined?
    - methods
    - none?
    - private_instance_methods
    - private_method_defined?
    - private_methods
    - protected_instance_methods
    - protected_method_defined?
    - public_instance_methods
    - public_method_defined?
    - public_methods
    - push
    - respond_to?
    - respond_to_missing?
    - singleton_methods
    - store

Kata/ConstructorDiscipline:
  Description: >-
    Constructors assign; they do not compute. Shaping what was passed in is
    assigning it: a Kernel conversion (`Array(items)`, `Integer(port)`), a
    `to_*` conversion, a defensive `dup`, and `freeze`. So is the object's own
    state that nothing could inject: a lock or a queue (`Mutex.new`), or an
    empty collection (`Set.new`). A clock, a random number, a client, or a
    sum is a dependency or a computation, and is flagged
    (`@id = SecureRandom.uuid`).
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  AllowedMethods:
    - Array
    - Complex
    - Float
    - Hash
    - Integer
    - Rational
    - String
    - dup
    - freeze
    - raise
  AllowedConstructors:
    - Array
    - ConditionVariable
    - Hash
    - Monitor
    - Mutex
    - Queue
    - Set
    - SizedQueue
    - String
    - Thread::ConditionVariable
    - Thread::Mutex
    - Thread::Queue
    - Thread::SizedQueue
  Exclude:
    - "spec/**/*"
    - "test/**/*"

Kata/NoClassMethodLogic:
  Description: >-
    Classes construct; instances work. `AllowedNames` holds the constructors
    (`build`, `parse`, `of`, `from`, `from_*`, `new`, `[]`), the hooks Ruby
    calls by name (`included`, `inherited`, `method_added`), and the
    serialization protocols a framework calls on the class: a coder for
    ActiveRecord `serialize` or YAML answers `load`/`dump`, Marshal `_load`,
    the JSON additions `json_create`.
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "db/*migrate/**/*"
  AllowedNames:
    - "[]"
    - _load
    - build
    - const_missing
    - dump
    - extended
    - from
    - included
    - inherited
    - json_create
    - load
    - method_added
    - new
    - of
    - parse
    - prepended
    - singleton_method_added

Kata/NoHashAsObject:
  Description: >-
    Keys that travel together are an object without a name. Keyword
    arguments are exempt, as is a lookup table a constant names, and the hash
    a serialization method returns: inside `to_h` or `as_json` the object
    already has a name, and the protocol asks for a hash.
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  MaxKeys: 4
  AllowedMethods:
    - as_json
    - attributes
    - deconstruct_keys
    - serializable_hash
    - to_h
    - to_hash
    - to_json
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "config/**/*"

Kata/ClockDiscipline:
  Description: "Read time from an injected clock, not the ambient one."
