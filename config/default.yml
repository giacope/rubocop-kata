    - initialize_copy
    - initialize_dup
    - instance_method
    - marshal_dump
    - marshal_load
    - method_added
    - method_missing
    - method_removed
    - not_found
    - password_required
    - perform_async
    - perform_later
    - perform_now
    - permitted_attributes
    - policy_scope
    - primary_key
    - pundit_user
    - read_nonblock
    - record_not_found
