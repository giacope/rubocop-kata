plugins:
  - rubocop-elegant
  - rubocop-rspec
  - rubocop-performance
  - rubocop-packaging
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  Exclude:
    - "vendor/**/*"

Kata/AgentNoun:
  Description: "Name classes for the thing they are, not the work they do."
  Enabled: true
  VersionAdded: "0.1"
  AllowedNames:
    - Error

Kata/NoComments:
  Description: "Say it in the code; keep only comments the machine or the law reads."
  Enabled: true
  VersionAdded: "0.1"
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Kata/GoodMethodName:
  Description: >-
    One word per method name. A second word is allowed only when it does not
    hide a missing object: a role prefix (`after_fork`), a role suffix
    (`file_of`), or a reviewed domain term. Do not delete the underscore —
    Kata/RealWords catches the smash.
  Enabled: true
  VersionAdded: "0.5"
  MaxWords: 2
  Pattern: "^[a-z][a-z0-9]{0,15}$"
  Prefixes:
    - after
    - all
    - any
    - around
    - as
    - at
    - before
    - by
    - each
    - every
    - fake
    - for
    - from
    - into
    - "no"
    - non
    - "on"
    - per
    - test
    - the
    - to
    - unless
    - until
    - when
    - while
    - with
    - without
  Suffixes:
    - at
    - by
    - for
    - from
    - in
    - into
    - of
    - on
    - over
    - per
    - to
    - under
    - with
    - without
  Terms: []
  AllowedNames: []

Kata/GoodVariableName:
  Description: >-
    One word per variable name. A second word means a missing object, not a
    name to smash together — Kata/RealWords catches the smash. Role prefixes, role
    suffixes, and reviewed domain terms are the three exceptions.
  Enabled: true
  VersionAdded: "0.5"
  MaxWords: 2
  Pattern: "^[a-z][a-z0-9]{0,15}$"
  Prefixes:
    - after
    - all
    - any
    - around
    - as
    - at
    - before
    - by
    - each
    - every
    - fake
    - for
    - from
    - into
    - "no"
    - non
    - "on"
    - per
    - test
    - the
    - to
    - unless
    - until
    - when
    - while
    - with
    - without
  Suffixes:
    - at
    - by
    - for
    - from
    - in
    - into
    - of
    - on
    - over
    - per
    - to
    - under
    - with
    - without
  Terms: []
  AllowedNames: []

Kata/IoDiscipline:
  Description: "Write through an injected io, not bare puts/warn/pp/p."
  Enabled: true
  VersionAdded: "0.1"
  Exclude:
    - "spec/**/*"
    - "bin/**/*"
    - "exe/**/*"
    - "Rakefile"
    - "*.gemspec"

Kata/ProsePlacement:
  Description: "Keep sentence-length strings in the presentation layer."
  Enabled: false
  VersionAdded: "0.1"

Kata/NoUtilName:
  Description: "Junk-drawer names hide the concept the code is missing."
  Enabled: true
  VersionAdded: "0.3"
  BannedNames:
    - Util
    - Utils
    - Utility
    - Utilities
    - Helper
    - Helpers
    - Manager
    - Service
    - Common
    - Misc
    - Shared

Kata/RealWords:
  Description: >-
    Every name segment is a dictionary word: `errorcount` is a smash, `cfg`
    is an abbreviation, `mutant` is fine. The dictionary ships with the gem;
    `Terms` holds reviewed domain jargon, `AllowedNames` exempts names an
    external protocol dictates.
  Enabled: true
  VersionAdded: "0.5"
  BannedWords:
    - usr
    - cfg
    - tmp
    - res
    - val
    - obj
    - arr
    - num
    - buf
    - idx
    - ctx
    - err
    - len
    - msg
    - pos
    - ptr
  Terms: []
  AllowedNames: []

Kata/BuilderNoun:
  Description: "Builders are named for what they return; verbs are for side effects."
  Enabled: true
  VersionAdded: "0.3"
  BannedPrefixes:
    - get
    - calculate
    - compute
    - retrieve
    - generate

Kata/NoBooleanFlag:
  Description: "A boolean flag is two methods trapped in one."
  Enabled: true
  VersionAdded: "0.3"
  Exclude:
    - "spec/**/*"

Kata/ConstructorDiscipline:
  Description: "Constructors assign; they do not compute."
  Enabled: true
  VersionAdded: "0.3"
  Exclude:
    - "spec/**/*"

Kata/NoClassMethodLogic:
  Description: "Classes construct; instances work."
  Enabled: true
  VersionAdded: "0.3"
  Exclude:
    - "spec/**/*"
  AllowedNames:
    - build
    - parse
    - of

Kata/NoHashAsObject:
  Description: "Keys that travel together are an object without a name."
  Enabled: true
  VersionAdded: "0.3"
  MaxKeys: 4
  Exclude:
    - "spec/**/*"
    - "config/**/*"

Kata/ClockDiscipline:
  Description: "Read time from an injected clock, not the ambient one."
  Enabled: true
  VersionAdded: "0.3"
  Exclude:
    - "spec/**/*"
    - "bin/**/*"
    - "exe/**/*"

Kata/EnvDiscipline:
  Description: "ENV belongs in the boot layer; pass configuration in."
  Enabled: true
  VersionAdded: "0.3"
  Exclude:
    - "spec/**/*"
    - "config/**/*"
    - "bin/**/*"
    - "exe/**/*"
    - "Rakefile"
    - "*.gemspec"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/ItBlockParameter:
  EnforcedStyle: only_numbered_parameters

Style/FormatStringToken:
  EnforcedStyle: unannotated

Style/EndlessMethod:
  EnforcedStyle: allow_single_line

Naming/RescuedExceptionsVariableName:
  PreferredName: error

# Memoization caches are marked with a leading underscore (@_name), so lazy
# state is visible at the read site; Kata/GoodVariableName knows the
# same @_word shape.
Naming/MemoizedInstanceVariableName:
  EnforcedStyleForLeadingUnderscores: required

# Kata owns naming now; the upstream cops force strictly one word, which is
# what drives the underscore-smashing dodge.
Elegant/GoodMethodName:
  Enabled: false

Elegant/GoodVariableName:
  Enabled: false

Layout/LineLength:
  Max: 120

Layout/LineEndStringConcatenationIndentation:
  EnforcedStyle: indented

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/ClassLength:
  Max: 100

Metrics/ModuleLength:
  Max: 100
  Exclude:
    - "spec/**/*"

Metrics/MethodLength:
  Max: 5
  Exclude:
    - "spec/**/*"

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true
  Exclude:
    - "spec/**/*"

RSpec/ExampleLength:
  CountAsOne:
    - heredoc

RSpec/VerifiedDoubles:
  Enabled: true

Elegant/NoEmptyLinesInBlocks:
  Exclude:
    - "spec/**/*"

Elegant/NoEmptyLinesInMethods:
  Exclude:
    - "spec/**/*"

Elegant/NoComments:
  Enabled: false

Style/MethodCallWithArgsParentheses:
  Enabled: false

# --- Core layout cops that autocorrect-loop against Elegant/PairedBrackets
# and Elegant/NoEmptyLines*; the Elegant cops win.
Layout/BlockAlignment:
  Enabled: false

Layout/MultilineBlockLayout:
  Enabled: false

Layout/ClosingParenthesisIndentation:
  Enabled: false

Layout/FirstArgumentIndentation:
  Enabled: false

Layout/MultilineMethodCallBraceLayout:
  Enabled: false

Layout/MultilineArrayBraceLayout:
  Enabled: false

Layout/MultilineHashBraceLayout:
  Enabled: false

Layout/EmptyLinesAroundAccessModifier:
  Enabled: false

Layout/EmptyLinesAfterModuleInclusion:
  Enabled: false

# --- Correctors known to rewrite code incorrectly; report only.
# Inlines a variable past side effects (ivar resets, later statements) and
# corrupts Ruby 3.1 keyword shorthand.
Elegant/NoRedundantVariable:
  AutoCorrect: false

# Rewrites reopened classes into modules, clashing with the primary
# class definition at boot.
Style/StaticClass:
  AutoCorrect: false

# Turns lenient `.to_i` into strict Integer(x, 10), which raises on
# nils/Integers call sites legitimately receive.
Lint/NumberConversion:
  AutoCorrect: false

# Alphabetizing requires breaks load-order-dependent boot sequences.
Style/RequireOrder:
  Enabled: false

ThreadSafety/DirChdir:
  Exclude:
    - "spec/**/*"
