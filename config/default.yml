    - "/"
    - "<"
    - "<="
    - "<=>"
    - "=="
    - "==="
    - "=~"
    - ">"
    - ">="
    - "[]"
    - "[]="
    - _dump
    - as_json
    - call
    - coerce
    - each
    - encode_with
    - eql?
    - equal?
    - hash
    - init_with
    - initialize
    - initialize_copy
    - inspect
    - marshal_dump
    - marshal_load
    - method_missing
    - respond_to_missing?
    - to_a
    - to_ary
    - to_h
    - to_hash
    - to_json
    - to_proc
    - to_s
    - to_str
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/**/*"
    - "config/**/*"
    - "app/controllers/**/*"
    - "*/app/controllers/**/*"
    - "app/mailers/**/*"
    - "*/app/mailers/**/*"
    - "app/helpers/**/*"
    - "*/app/helpers/**/*"
    - "app/views/**/*"
    - "*/app/views/**/*"

Kata/NoGetter:
  Description: >-
    No getters: a public `attr_reader`, or a method that only returns the
    field of its name (`def balance = @balance`), hands an object's data to
    whoever asks, and the logic about it moves to them (`Label` building text
    from `customer.first_name` and `customer.last_name`). Tell the object what
    to do with its fields, or have it print itself to a medium it is given
    (Elegant Objects' printers instead of getters). `Struct.new` and
    `Data.define` mint a getter for every field: a data bag. A private or
    protected reader is the object's own. Off by default: config/strict.yml
    turns it on.
  Enabled: false
  VersionAdded: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/**/*"
    - "config/**/*"

Kata/NoHardWiring:
  Description: >-
    An instance method that builds one of the project's classes as a
    collaborator has wired it in: no caller can hand it another
    implementation, and a test has to stub `new`. How long the object lives
    and what it carries decide. One that outlives the call is a
    collaborator: kept in a field, a class variable or a global
    (`@gateway ||= Gateway.new`, directly or through a local), or handed to
    the constructor of an object that outlives the call (`@log ||=
    Logger.new(Format.new(@name))`). So is one that carries configuration
    the caller cannot change: built from literals alone, from nothing, or
    from a constant or global the method does not own, and talked to
    (`Gateway.new("live").charge(@cents)`, `Repo.new(DB).find(id)`) or
    handed to another object's constructor (`Order.new(Gateway.new("live"))`).
    Take it in the constructor; a parameter default (`gateway =
    Gateway.new("live")`) is the seam, as Elegant Objects' secondary
    constructor is. An object that lives only inside one call is the call's
    own data, whatever the method does to it, and passes: one built from the
    method's own inputs (its arguments, a block's arguments, its locals and
    fields, `self`, the class's own constants; `Nesting.new(node).qualified`,
    an entry built per row, filled and saved, `Writer.new(buffer:,
    parts:).emit`), one returned, passed to a method or left as a block's
    value (`Cart.new(@items + [item])`, `form = Form.new; form.add(upload);
    submit(form)`, `Jar.new.tap { it.parse(text) }`), and an empty one the
    call fills and reads back (`buffer = Buffer.new;
    Writer.new(buffer:).emit; buffer.content`). Injected, one instance would
    carry every call's contents. Asking a fresh object what its class
    answers (`respond_to?`, `method`) is not talking to it, and a message
    sent to a name before it was bound to the new object goes to the name's
    earlier value. The class building itself passes too. Class methods,
    constructors and the composition roots a framework instantiates are
    where objects are wired: controllers, view helpers, jobs, mailers,
    tests, rake tasks, `bin/`, `config/`, a subclass of one of
    the `RootSuperclasses`, and a module a load hook in `RootHooks` mixes into
    the framework's class (`ActiveSupport.on_load(:action_controller) {
    include Tracking }`); the framework builds them, so they cannot be handed
    a collaborator. A class under one of the `BuiltSuperclasses` (an
    ActiveRecord or Mongoid model: a loaded record is allocated past
    `initialize`) and a module have no constructor to take one in either, but
    they are not roots: they are reported with the seam they have, a
    parameter of the method with the `new` as its default, or the object
    built where the model is used. Ruby's and other libraries' classes are
    values or boundaries, and pass. Off by default: config/strict.yml turns
    it on.
  Enabled: false
  VersionAdded: "0.11"
  RootSuperclasses:
    - ActionController::API
    - ActionController::Base
    - ActionController::TestCase
    - ActionDispatch::IntegrationTest
    - ActionMailer::Base
    - ActionMailer::TestCase
    - ActionView::TestCase
    - ActiveJob::Base
    - ActiveJob::TestCase
    - ActiveSupport::TestCase
    - ApplicationController
    - ApplicationJob
    - ApplicationMailer
    - Minitest::Test
    - Rails::Generators::Base
    - Rails::Generators::NamedBase
    - RuboCop::Cop::Base
    - Test::Unit::TestCase
    - Thor
    - Thor::Group
  RootHooks:
    - action_controller
    - action_controller_api
    - action_controller_base
    - action_mailer
    - action_view
    - active_job
  BuiltSuperclasses:
    - ActiveRecord::Base
    - ApplicationRecord
    - Mongoid::Document
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "app/controllers/**/*"
    - "*/app/controllers/**/*"
    - "app/helpers/**/*"
    - "*/app/helpers/**/*"
    - "app/jobs/**/*"
    - "*/app/jobs/**/*"
    - "app/mailers/**/*"
    - "*/app/mailers/**/*"
    - "app/workers/**/*"
    - "*/app/workers/**/*"
    - "**/*_controller.rb"
    - "**/*_job.rb"
    - "**/*_mailer.rb"
    - "**/*_worker.rb"
