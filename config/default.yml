Kata/IoDiscipline:
  Description: >-
    Write through an injected io, not bare puts/warn/pp/p. Where the class
    already holds a stream (`@io`, `@out`, `@stderr`, …), the message names
    it; where nothing is injected, it names the seam to add
    (`def initialize(io: $stdout)`). Code outside every class, module and
    method is a script's boot layer, and its terminal is the boot layer's
    stream, as Kata/EnvDiscipline and Kata/ClockDiscipline read it.
  Enabled: true
  VersionAdded: "0.1"
  VersionChanged: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "db/*migrate/**/*"
    - "bin/**/*"
    - "exe/**/*"
    - "script/**/*"
    - "config/**/*"
    - "config.ru"
    - "db/seeds.rb"
    - "db/seeds/**/*"
    - "lib/tasks/**/*"
    - "Rakefile"
    - "**/*.rake"
    - "*.gemspec"
    - "Gemfile"
    - "**/Gemfile"
    - "gems.rb"
    - "**/*.gemfile"
    - "**/*.jbuilder"

Kata/ProsePlacement:
  Description: "Keep sentence-length strings in the presentation layer."
  Enabled: false
  VersionAdded: "0.1"

Kata/RealWords:
  Description: >-
    Every name segment is a word: an English word, an initialism (`api`,
    `uuid`), a technology's name (`rspec`, `postgres`), or the platform's own
    spelling of the thing (`env` for Rack and `ENV`, `params`, `attr`, `dir`,
    `io`, `regexp`, `proc`, `stdout`, `mkdir`). `errorcount` is a smash and
    fails. A clipping of an English word fails wherever a dictionary lists it:
    `args`, `opts`, `src`, `cmd`, `impl`, `str`, `req`, `conn` are all spelled
    out, and the message names the word (`req` is `request`); `foo` and `qux`
    are placeholders. The shipped table is data/clippings.txt; `BannedWords`
    adds a project's own, `Terms` re-allows one as reviewed jargon, and
    `AllowedNames` exempts names a protocol dictates (`to_str`). English is
    English: British, Canadian and Australian spellings (`organisation`,
    `colour`, `offence`, `labelled`, `metre`) are words; `Spelling: en-US`
    accepts American spelling only. The project's own name is its
    vocabulary: kata fills `Vocabulary` with the segments of its gemspec
    names and Rails application module (`kata` in rubocop-kata), of the
    names of its dependencies (`pagy`, `sshkit`) and of its own constants
    (`cref` for zeitwerk's `Cref`), and, for a gem that depends on parser,
    rubocop-ast, rubocop or unparser, with the parser's whole node types
    (`lvasgn`, `dstr`, `kwoptarg`), and turns on `NodeCallbacks`, which
    leaves a callback named for a node type alone (`on_str`, `on_op_asgn`).
    No vocabulary unbans a clipping: `str`, `args` and `sym` are spelled out
    there too. A word kata accepts is inflected (`autoloaded`,
    `autoloading`, `favorited`) where no dictionary spells its forms; where
    one does (`submitted`, `reading`), any other spelling is a typo, and a
    verb-particle noun (`login`, `setup`) inflects as the phrase.
  Enabled: true
  VersionAdded: "0.5"
  VersionChanged: "0.11"
  Spelling: any
  BannedWords: []
  Terms: []
  Vocabulary: []
  NodeCallbacks: false
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  AllowedNames:
    - to_ary
    - to_int
    - to_str
    - to_sym

Kata/BuilderNoun:
  Description: >-
    Builders are named for what they return; verbs are for side effects. A
    method that calls `super`, or that overrides a method of the project's
    superclass or included module (flipper's adapters implementing
    `Flipper::Adapter#get_all`), keeps its ancestor's name, reported once
    where it was chosen; a stand-in for a message the project's code sends
    but never defines (`get_callbacks` in a spec double of ActiveSupport)
    answers to the name the caller chose. A method that issues a command
    anywhere in its body, conditional or not, one of the `Commands` (a file
    write, a generator or Thor action such as `create_file`, `route` or
    `invoke`; a constant alone, such as `FileUtils`, stands for each of its
    methods), is a side effect, not a builder; so is a public method of a
    generator, a subclass of one of the `StepSuperclasses`, which Rails or
    Thor runs as a step. A predicate (`generate_ids?`) answers a question
    and builds nothing.
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  Commands:
    - Dir.mkdir
    - File.binwrite
    - File.write
    - FileUtils
    - IO.binwrite
    - IO.write
    - add_source
    - append_to_file
    - chmod
    - comment_lines
    - copy_file
    - create_file
    - create_link
    - directory
    - empty_directory
    - exec
    - generate
    - gsub_file
    - initializer
    - inject_into_class
    - inject_into_file
    - inject_into_module
    - insert_into_file
    - invoke
    - migration_template
    - prepend_to_file
    - rails_command
    - rake
    - remove_file
    - route
    - run
    - spawn
    - system
    - template
    - uncomment_lines
  StepSuperclasses:
    - ActiveRecord::Generators::Base
    - Rails::Generators::Base
    - Rails::Generators::NamedBase
    - Thor
    - Thor::Group
  BannedPrefixes:
    - get
    - calculate
    - compute
    - retrieve
    - generate
  AllowedNames: []

Kata/NoBooleanFlag:
  Description: >-
    A boolean flag is two methods trapped in one: at a call, and as a
    positional parameter's default. A boolean the callee stores, binds or
    compares is a value, not a flag: the value of a setting named before it
    (`set :sessions, true`, `auth_value_method :verify?, false`,
    `update_attribute(:spam, false)`; not `send(:name, true)`, which passes
    a flag on), a bind after a SQL string with a placeholder
    (`where("active = ?", true)`), an expectation (`eq(true)`,
    `receive(:x).with(false)`), a hash value, and an attribute writer
    (`config.x = true`). `AllowedMethods` holds the calls whose boolean is a
    protocol or a value rather than a flag — Ruby's reflection
    (`respond_to?(name, true)`), a default (`fetch(:ssl, false)`), a value
    searched for or compared (`flags.index(true)`, `eql?(false)`), a stored
    value (`instance_variable_set(:@done, false)`, `set`, a
    `Concurrent::IVar`'s `try_set(true)`), a value converted or rendered
    (`quote(true)`, `type_cast(false)`, `cast`, `serialize`, `dump`), a
    query (`where`, `find_by`, `exists?`, `update`), RSpec's matchers — and
    the defs whose signature Ruby dictates (`respond_to_missing?`).
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "db/*migrate/**/*"
    - "**/*.jbuilder"
  AllowedMethods:
    - all?
    - and_return
    - any?
    - be
    - cast
