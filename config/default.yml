plugins:
  - rubocop-elegant
  - rubocop-rspec
  - rubocop-performance
  - rubocop-packaging
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  Exclude:
    - "vendor/**/*"

Kata/GoodClassName:
  Description: >-
    A class names one object that exists in the model. Three shapes hide that
    object: a doer name (`-er`/`-or`), a junk-drawer name (`Service`, `Util`,
    `Data`), and a name packing several concepts (`CustomerOrderPayment`).
    Compound syntax is not the smell — `CreditCard` is one concept, and belongs
    in `Terms`. `AllowedNames` and `BannedNames` match a whole name or a
    trailing segment, so `Error` also exempts `UsageError` and `Service` also
    catches `InvoiceService`. The default `AllowedNames` holds the suffixes a
    framework resolves a class by, which are contracts rather than naming
    choices, plus thing-words that merely end in `-er`/`-or` — `User` and
    `Order` are objects, not doers. Absorbs Kata/AgentNoun and the class half
    of Kata/NoUtilName.
  Enabled: true
  VersionAdded: "0.9"
  MaxWords: 2
  AllowedNames:
    - Actor
    - Author
    - Buffer
    - Center
    - Chapter
    - Character
    - Color
    - Container
    - Controller
    - Cursor
    - Customer
    - Decorator
    - Delegator
    - Driver
    - Enumerator
    - Error
    - Fiber
    - Folder
    - Helper
    - Job
    - Ledger
    - Logger
    - Mailer
    - Member
    - Monitor
    - Order
    - Owner
    - Presenter
    - Serializer
    - Server
    - Supplier
    - Timer
    - Transfer
    - User
    - Validator
    - Vector
  BannedNames:
    - Util
    - Utils
    - Utility
    - Utilities
    - Service
    - Data
    - Info
    - Misc
  Terms:
    - AbstractSyntaxTree
    - BillOfLading
    - BinarySearchTree
    - HashWithIndifferentAccess
    - JsonWebToken
    - OneTimePassword
    - RedBlackTree
    - StockKeepingUnit
    - TimeWithZone
    - UnitOfWork

Kata/GoodModuleName:
  Description: >-
    A module names a domain vocabulary or boundary, not an implementation
    category. Layer buckets (`Services`, `Helpers`, `Logic`), vague shared
    namespaces (`Common`, `Shared`, `Core`), doer names, and names packing
    several concepts are flagged; a genuine compound domain like
    `AccessControl` passes. `BannedNames` matches a whole name or a trailing
    segment, so `Services` also catches `ApplicationServices`. The default
    `AllowedNames` holds the framework suffixes, so reopening
    `ActionController` or `ActionMailer` is not an offense; reopening another
    library's junk drawer (`FileUtils`) is a file-boundary `Exclude`, not a
    naming choice. Absorbs the module half of Kata/NoUtilName.
  Enabled: true
  VersionAdded: "0.9"
  MaxWords: 2
  AllowedNames:
    - Actor
    - Author
    - Buffer
    - Center
    - Chapter
    - Character
    - Color
    - Container
    - Controller
    - Cursor
    - Customer
    - Decorator
    - Delegator
    - Driver
    - Enumerator
    - Error
    - Fiber
    - Folder
    - Helper
    - Job
    - Ledger
    - Logger
    - Mailer
    - Member
    - Monitor
    - Order
    - Owner
    - Presenter
    - Serializer
    - Server
    - Supplier
    - Timer
    - Transfer
    - User
    - Validator
    - Vector
  BannedNames:
    - Common
    - Core
    - Decorators
    - Extensions
    - Forms
    - Helpers
    - Jobs
    - Logic
    - Managers
    - Misc
    - Mixins
    - Models
    - Policies
    - Presenters
    - Queries
    - Serializers
    - Service
    - Services
    - Shared
    - Util
    - Utilities
    - Utility
    - Utils
    - Validators
    - Workers
  Terms: []

Kata/NoComments:
  Description: "Say it in the code; keep only comments the machine or the law reads."
  Enabled: true
  VersionAdded: "0.1"
  VersionChanged: "0.8"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "*.gemspec"
    - "Gemfile"
    - "**/Gemfile"

Kata/GoodMethodName:
  Description: >-
    One word per method name. A second word is allowed only when it does not
    hide a missing object: a role prefix (`after_fork`), a role suffix
    (`file_of`), or a reviewed domain term. A name that chains actions
    (`validate_and_save`) or spells out another object's property
    (`customer_address`) is a missing method home, not a naming problem.
    Do not delete the underscore — Kata/RealWords catches the smash.
  Enabled: true
  VersionAdded: "0.5"
  VersionChanged: "0.9"
  MaxWords: 2
  Pattern: "^[a-z][a-z0-9]{0,15}$"
  Prefixes:
    - after
    - all
    - any
    - actual
    - around
    - as
    - assert
    - at
    - before
    - by
    - current
    - default
    - each
    - end
    - every
    - expected
    - fake
    - for
    - from
    - into
    - max
    - min
    - new
    - "no"
    - non
    - "on"
    - other
    - per
    - raw
    - set
    - sort
    - start
    - test
    - the
    - to
    - total
    - unless
    - until
    - when
    - while
    - with
    - without
  Suffixes:
    - after
    - at
    - by
    - cents
    - code
    - count
    - date
    - dir
    - directory
    - file
    - for
    - from
    - id
    - in
    - into
    - key
    - level
    - ms
    - number
    - of
    - on
    - over
    - params
    - path
    - per
    - period
    - price
    - rate
    - seconds
    - secret
    - size
    - to
    - token
    - under
    - url
    - with
    - without
  Terms:
    - access_token
    - bank_account
    - billing_address
    - checkout_session
    - content_type
    - credit_card
    - date_of_birth
    - display_name
    - dry_run
    - event_type
    - exit_status
    - first_name
    - full_name
    - gift_card
    - grand_total
    - in_stock
    - ip_address
    - last_name
    - line_item
    - line_items
    - mark_as_read
    - method_name
    - middle_name
    - mime_type
    - out_of_stock
    - page_title
    - password_confirmation
    - payment_intent
    - payment_method
    - query_string
    - rate_limit
    - search_term
    - shipping_address
    - soft_delete
    - stack_trace
    - time_zone
    - user_agent
  AllowedNames:
    - active_for_authentication
    - after_sign_in_path_for
    - after_sign_out_path_for
    - assign_attributes
    - authenticate_user
    - const_missing
    - deconstruct_keys
    - deep_dup
    - default_scope
