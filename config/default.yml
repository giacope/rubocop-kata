plugins:
  - rubocop-elegant
  - rubocop-rspec
  - rubocop-performance
  - rubocop-packaging
  - rubocop-thread_safety

# A cop RuboCop adds in a later release stays off until kata lists it: a
# `bundle update` must not add an autocorrect nobody reviewed to `rubocop -a`.
# config/autocorrect.yml, layered on top, holds back every correction that is
# not structural (see data/autocorrect.txt: layout, delimiters, or an exact
# equivalent that resolves no name the project could define); the
# `SafeAutoCorrect: false` entries in this file name the ones seen to break
# code, and stay -A whatever the rule says.
# The pending cops kata wants are enabled one by one at the end of this file.
# A project's own `AllCops: Exclude` adds to the paths kata skips (vendored
# copies, generated files, the schema, and a generator's templates, files
# copied into another project and often ERB, as hashira and kimera skip
# them) instead of replacing them; a project
# that wants RuboCop's replace-the-list behaviour writes
# `inherit_mode: { override: [Exclude] }` under its `AllCops`.
AllCops:
  NewCops: disable
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "vendor/**/*"
    - "**/vendor/**/*"
    - "db/*schema.rb"
    - "**/generators/**/*templates/**/*"
    - "**/generators/**/*template/**/*"
    - "**/lib/templates/**/*"

# A .jbuilder template is presentation, not an object: no Kata cop reads it.
# A cop with its own Exclude list carries the same entry, since a cop's list
# replaces the department's. `Roots` holds the project's own root constants
# (`Rubocop::Kata` for rubocop-kata, a Rails application's module), which
# kata fills from the gemspec names: the naming cops do not judge them, and
# their snake-case names count as a role prefix (`pundit_policy`).
Kata:
  Roots: []
  Exclude:
    - "**/*.jbuilder"

Kata/GoodClassName:
  Description: >-
    A class names one object that exists in the model. Three shapes hide that
    object: a doer name (`-er`/`-or`), a junk-drawer name (`Service`, `Util`,
    `Data`), and a name packing several concepts (`CustomerOrderPayment`).
    A brand rubocop-rspec spells as one word (`RSpec`, `RuboCop`, the keys of
    RSpec/SpecFilePathFormat's `CustomTransform`) is one concept: `RSpecSuite`
    is two. Compound syntax is not the smell — `CreditCard` is one concept, and belongs
    in `Terms`. A doer is an agent noun: the shipped WordNet data says whether
    a word's dominant sense is "one that <verb>s" (`Parser`, `Timer`) or a
    thing (`Number`, `Header`, `Order`), and an unknown word is a doer when its
    stem is a verb. A trailing `Suffixes` word names what the class is for
    (`UsersControllerTest` is for `UsersController`). `ContractSuffixes` are
    the words a framework resolves a class by (`UsersController`,
    `EmailValidator`, `InviteMailer`); the framework dictates the suffix, not
    the subject, so `UsersControllerTest` is judged as `Users`, and
    `ReportGeneratorJob` as `ReportGenerator`. A test of a module a framework
    resolves is judged by the module's subject, as Kata/GoodModuleName judges
    the module: `InvoicesHelperTest` as `Invoices`. A class whose superclass ends in the same word inherits that word
    (`ActionHandler < Avo::Actions::ActionHandler`, `AuditLogger < Logger`):
    the doer, if any, is the parent. A test cannot see its subject's
    superclass, which lives in another file, so a test whose subject ends in
    the word of one of the `FrameworkSuperclasses` is judged as that heir:
    `ScrubbingFormatterTest` passes, as `ScrubbingFormatter < Logger::Formatter`
    does, while `PaymentProcessorTest` is still a doer. A subject that names
    the word without inheriting it is still flagged in its own file. A class
    whose superclass is one of the `ContractSuperclasses` is named by a
    contract: RuboCop resolves `Style/UseLanguageServerAliases` to the class
    of that name, so a cop class is not judged. A class
    whose superclass is one of the `EntitySuperclasses` (`ApplicationRecord`)
    is a persisted record of a thing in the domain (`Manufacturer`,
    `Teacher`), so the doer test does not apply to it; junk drawers and
    crowded names still do. An unknown word ending in `-er` is a doer only
    when its stem is a verb (`Chunker`), not a brand (`Instapaper`). `AllowedNames` match a whole name or a
    trailing segment: exception classes (`Error`), the domain roles a model
    represents rather than performs (`User`, `Owner`), words whose thing and
    doer readings are equally common in code (`Server`, `Container`), and
    `Header`, which WordNet derives from the verb `head`. A class is judged
    where it is defined: a reopen with no superclass whose body holds only
    nested classes and modules is a namespace wrapper, not a definition.
  Enabled: true
  VersionAdded: "0.9"
  VersionChanged: "0.11"
  Exclude:
    - "db/*migrate/**/*"
    - "**/*.jbuilder"
  MaxWords: 2
  Suffixes:
    - Test
    - TestCase
    - Spec
    - Preview
  ContractSuffixes:
    - Adapter
    - Channel
    - Component
    - Controller
    - Decorator
    - Generator
    - Job
    - Mailbox
    - Mailer
    - Policy
    - Serializer
    - Task
    - Validator
  FrameworkSuperclasses:
    - ActiveSupport::LogSubscriber
    - Logger
    - Logger::Formatter
  EntitySuperclasses:
    - ActiveRecord::Base
    - ApplicationRecord
  ContractSuperclasses:
    - RuboCop::Cop::Base
    - RuboCop::Cop::Cop
  AllowedNames: &type_names
    - Actor
    - Container
    - Docker
    - Error
    - Header
    - Owner
    - Server
    - Supplier
    - User
    - Vendor
  BannedNames:
    - Util
    - Utils
    - Utility
    - Utilities
    - Service
    - Data
    - Info
    - Misc
  Terms:
    - AbstractSyntaxTree
    - BillOfLading
    - BinarySearchTree
    - HashWithIndifferentAccess
    - JsonWebToken
    - OneTimePassword
    - RedBlackTree
    - StockKeepingUnit
    - TimeWithZone
    - UnitOfWork

Kata/GoodModuleName:
  Description: >-
    A module names a domain vocabulary or boundary, not an implementation
    category. Layer buckets (`Services`, `Helpers`, `Logic`), vague shared
    namespaces (`Common`, `Shared`, `Core`), doer names, and names packing
    several concepts are flagged; a genuine compound domain like
    `AccessControl` passes. `BannedNames` matches a whole name or a trailing
    segment, so `Services` also catches `ApplicationServices`. `ContractSuffixes`
    hold the words a framework resolves a module by: Rails includes
    `app/helpers/invoices_helper.rb` as `InvoicesHelper`, and a reopen of
    `ActionController` must spell it exactly. Reopening another library's
    junk drawer (`FileUtils`) is a file-boundary `Exclude`, not a naming
    choice. `AllowedNames` is the class list. Absorbs the module half of
    Kata/NoUtilName. A namespace reopened around the classes of many files
    is one naming decision, judged once: in the file named for it
    (`lib/flipper/services.rb`), else in its opening with the most
    statements, among the files `OwnedPaths` matches. The project's own root
    constants (`Faker`, `Nanoc::Core`: the `Kata` department's `Roots`, which
    kata fills from the gemspec names and the Rails application's module)
    name the gem, and pass here and in Kata/GoodClassName.
  Enabled: true
  VersionAdded: "0.9"
  VersionChanged: "0.11"
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  MaxWords: 2
  ContractSuffixes:
    - Controller
    - Helper
    - Mailer
  AllowedNames: *type_names
  BannedNames:
    - Common
    - Core
    - Decorators
    - Extensions
    - Forms
    - Helpers
    - Jobs
    - Logic
    - Managers
    - Misc
    - Mixins
    - Models
    - Policies
    - Presenters
    - Queries
    - Serializers
    - Service
    - Services
    - Shared
    - Util
    - Utilities
    - Utility
    - Utils
    - Validators
    - Workers
  Terms: []

Kata/NoComments:
  Description: >-
    Say it in the code; keep only what the code cannot say. Code can say what
    and how; it cannot cite an external constraint, and a tool cannot read
    prose. So the cop keeps magic comments and editor modelines (deleting
    `# -*- coding: binary -*-` changes every string literal), tool directives
    (RuboCop, Standard, SimpleCov, Steep `@type`, RBS `#:` and `@rbs`, Sorbet,
    reek `:reek:`, kimera, hashira, RubyMine `language=`), RDoc and YARD
    directives, licence headers, every comment block that cites a URL, an
    issue or pull request (`rails/rails#123`, `#123`), an RFC, a CVE or a
    version constraint (`Compatibility with RSpec < 3.0`, `Ruby >= 3.2`). A
    tool's name opens a directive only with its colon (`# kimera:disable`):
    `# kimera cannot say` is prose. Documentation is prose too, YARD tags
    and all: a name, a type or a test says it. A gem that publishes its API
    documentation sets `AllowDocumentation: true` to keep a block whose next
    definition is public — a class, module, method,
    `attr_reader`/`attr_writer`/`attr_accessor`, `define_method` or a
    constant not made private — in any markup (RDoc, Markdown, YARD), read
    across a Sorbet `sig { ... }`, a bare `memoize` or `memo_wise` line, and
    the blank line RDoc allows after a `##` opener, and any block carrying a
    YARD tag; a block inside a method body, above a private or protected
    method, or above a top-level method is prose either way. One block of
    consecutive full-line comments is one offense.
    `AllowedPatterns` adds the directives of tools it does not know. Removing
    a comment loses what it said, so the correction is unsafe: `rubocop -A`
    applies it, `rubocop -a` does not. `config/` is excluded: its comments
    are the framework's generated guidance.
  Enabled: true
  VersionAdded: "0.1"
  VersionChanged: "0.11"
  SafeAutoCorrect: false
  AllowDocumentation: false
  AllowCitations: true
  AllowedPatterns: []
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "config/**/*"
    - "config.ru"
    - "*.gemspec"
    - "Gemfile"
    - "**/Gemfile"
    - "**/*.jbuilder"

Kata/GoodMethodName:
  Description: >-
    At most `MaxWords` words per method name (two by default), not counting
    a role prefix (`after_fork`), a role suffix (`file_of`), or a reviewed
    domain term in `Terms`. Two words are often the honest name of one
    concept (`line_items`, `parse_header`); three or more usually describe an
    object or a method home that is missing (`customer_billing_address`). A
    name that chains actions (`validate_and_save`) is two methods in one at
    any length. Do not delete the underscore — Kata/RealWords catches the
    smash. `MaxWords: 1` restores the one-word discipline for a team that
    wants it. A Minitest `test_` method in a test class is a sentence, like
    an RSpec description, and goes unpriced. A name a dispatcher dictates is
    a contract, not a choice: `AllowedPatterns` holds those patterns, Prism's
    `on_call_node_enter` listeners among them.
