Kata/ConstructorDiscipline:
  Description: >-
    Constructors assign; they do not compute. Shaping what was passed in is
    assigning it: a Kernel conversion (`Array(items)`, `Integer(port)`), a
    `to_*` conversion, a defensive `dup`, and `freeze`. So is the object's own
    state that nothing could inject: a lock or a queue (`Mutex.new`), or an
    empty collection (`Set.new`, `+""`, `{}.compare_by_identity`). A clock, a
    random number, a client, or a sum is a dependency or a computation, and
    is flagged (`@id = SecureRandom.uuid`); a parameter default is the seam
    such a dependency comes in through (`def initialize(clock: Time)`), and
    passes. A guard may raise, through `raise` or one of the project's
    `RaisingMethods` (`UI.user_error!`). Assigning through the object's own
    writer (`self.project = project`) is assigning; Kata/NoSetter reports
    the writer.
  Enabled: true
  Sorbet: false
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  RaisingMethods:
    - fail
    - raise
  AllowedMethods:
    - Array
    - Complex
    - Float
    - Hash
    - Integer
    - Rational
    - String
    - dup
    - freeze
    - raise
  AllowedConstructors:
    - Array
    - ConditionVariable
    - Hash
    - Monitor
    - Mutex
    - Queue
    - Set
    - SizedQueue
    - String
    - Thread::ConditionVariable
    - Thread::Mutex
    - Thread::Queue
    - Thread::SizedQueue
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*.jbuilder"

Kata/NoClassMethodLogic:
  Description: >-
    Classes construct; instances work. A class method whose result is a new
    instance of its class (`def self.from_legacy(row) = new(row.title)`) is a
    constructor whatever its name. `AllowedNames` holds the constructor names
    (`build`, `parse`, `of`, `from`, `from_*`, `new`, `[]`), the hooks and
    protocol methods Ruby calls on a class by name (`included`, `inherited`,
    `method_added`, `name`, `to_s`, `inspect`, `===`, `method_missing`), and the
    serialization protocols a framework calls on the class: a coder for
    ActiveRecord `serialize` or YAML answers `load`/`dump`, Marshal `_load`,
    the JSON additions `json_create`. A module declared with
    `module_function` or `extend self` is a bag of functions called on the
    module, the same logic with no class, and its declaration is reported.
    A class method that only returns a literal is a constant in disguise
    when it takes nothing and no other class under `OwnedPaths` defines it;
    a hook that takes an argument, that subclasses override
    (`def self.for_class?(_model) = false`) or that sibling classes answer
    alike (`def self.label = "Analytics"` in each request class a section
    sends `label` to) is the class's logic, and a constant read through
    `klass::LABEL` would be shared state in its place.
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  OwnedPaths:
    - "app/**/*.rb"
    - "*/app/**/*.rb"
    - "lib/**/*.rb"
    - "*/lib/**/*.rb"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "db/*migrate/**/*"
    - "**/*.jbuilder"
  AllowedNames:
    - "==="
    - "[]"
    - _load
    - build
    - const_missing
    - dump
    - extended
    - from
    - included
    - inherited
    - inspect
    - json_create
    - load
    - method_added
    - method_missing
    - name
    - new
    - of
    - parse
    - prepended
    - ransackable_associations
    - ransackable_attributes
    - ransackable_scopes
    - respond_to_missing?
    - singleton_method_added
    - to_s

Kata/NoHashAsObject:
  Description: >-
    Keys that travel together are an object without a name. Keyword
    arguments are exempt, as is a lookup table a constant names, rows and
    all, whether the table is a hash or an array of rows
    (`LABELS = { email: { en: ..., fr: ... } }`, `FLAVORS = [{ id: ..., ram: ... }]`),
    a value table a `TableMethods` call takes (Rails' `enum` mapping, under
    the Rails profile), and the hash a serialization method returns: inside
    `to_h` or `as_json` the object already has a name, and the protocol asks
    for a hash.
  Enabled: true
  Sorbet: false
  VersionAdded: "0.3"
  VersionChanged: "0.11"
  MaxKeys: 4
  TableMethods:
    - metadata=
  AllowedMethods:
    - as_json
    - attributes
    - deconstruct_keys
    - serializable_hash
    - to_h
    - to_hash
    - to_json
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "config/**/*"
    - "**/*.jbuilder"

Kata/ClockDiscipline:
  Description: >-
    Read time from an injected clock, not the ambient one. A parameter
    default is the seam, and code outside every class, module and method is a
    script's boot layer.
  Enabled: true
  VersionAdded: "0.3"
  VersionChanged: "0.11"
