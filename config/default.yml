# --- With Kata/ClassInModule it left only `class A::B`, whose lexical scope
# skips `A`; a module, a class and a compact namespace all name a namespace.
Elegant/NoClassInModule:
  Enabled: false

# --- Elegant's test-file exclusions never match Rails' `foo_test.rb`, nor a
# suite addressed by directory. Before RuboCop grew its own
# Style/OneClassPerFile, it read rubocop-elegant's `Style/OneClassPerFile:
# Enabled: false` as this cop's and switched it off; it is on either way.
Elegant/OneClassPerFile:
  Enabled: true
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "**/*_test.rb"
    - "test/**/*"
    - "spec/**/*"

# --- rubocop-elegant's config switches off cops RuboCop enables; kata turns
# back on the ones no Kata cop covers (spec/rubocop/kata/plugin_spec.rb lists
# the rest and why each stays off). A class variable is mutable state every
# subclass shares; a class variable another class reads
# (`Minitest.class_variable_set(:@@installed_at_exit, …)`) is that class's
# setting and is not reported (lib/rubocop/kata/foreign_setting.rb).
Style/ClassVars:
