Kata/IoDiscipline:
  Description: >-
    No hidden I/O: write through an injected io, not bare puts/warn/pp/p.
    Where the class already holds a stream (`@io`, `@out`, `@stderr`, …), the
    message names it; where nothing is injected, it names the seam to add
    (`def initialize(io: $stdout)`). A bare call the object answers itself
    is not Kernel's: one its class, a project ancestor or a mixin defines,
    delegates (`def_delegators`, `delegate`), aliases or reads
    (`attr_reader`) on the same side. Code outside every class, module and
    method is a script's boot layer, and its terminal is the boot layer's
    stream, as Kata/EnvDiscipline and Kata/ClockDiscipline read it, and so is
    a framework's boot hook (`initializer`, `to_prepare`, `on_load`); a
    parameter default is the seam. With `CheckEffects: true`
    (config/strict.yml) it reads the hidden I/O beyond the terminal too: bare
    `print` and `printf`; a global stream or service (`$stdout.puts`,
    `Rails.logger`, `Rails.cache`; `Globals`), which is never injected, and
    asks to be; and a file, network or shell call (`Effects`, by what it
    reaches: a path, a URL, a command; a constant alone stands for each of its
    methods) whose target is written into the code
    (`File.write("log/audit.log", …)`, `Net::HTTP.post(URI("https://…"))`, ``
    `git rev-parse HEAD` ``, `Dir.pwd`). One whose target holds a variable, an
    instance variable or a method's value (`File.write(@path, …)`), or a path
    anchored on the source file (`__dir__`, `__FILE__`), is the adapter whose
    job the effect is, and passes. Path arithmetic (`File.join`,
    `File.basename`; `AllowedMethods`) reaches nothing.
  Enabled: true
  VersionAdded: "0.1"
  VersionChanged: "0.11"
  CheckEffects: false
  Effects:
    path:
      - CSV.foreach
      - CSV.open
      - CSV.read
      - CSV.readlines
      - Dir
      - File
      - FileUtils
      - IO.binread
      - IO.binwrite
      - IO.copy_stream
      - IO.foreach
      - IO.read
      - IO.readlines
      - IO.sysopen
      - IO.write
      - JSON.load_file
      - YAML.load_file
      - YAML.safe_load_file
      - YAML.unsafe_load_file
    URL:
      - Excon.delete
      - Excon.get
      - Excon.head
      - Excon.new
      - Excon.patch
      - Excon.post
      - Excon.put
      - Faraday.delete
      - Faraday.get
      - Faraday.head
      - Faraday.new
      - Faraday.patch
      - Faraday.post
      - Faraday.put
      - HTTParty.delete
      - HTTParty.get
      - HTTParty.head
      - HTTParty.patch
      - HTTParty.post
      - HTTParty.put
      - Net::HTTP
      - RestClient.delete
      - RestClient.get
      - RestClient.head
      - RestClient.patch
      - RestClient.post
      - RestClient.put
      - Typhoeus.delete
      - Typhoeus.get
      - Typhoeus.head
      - Typhoeus.patch
      - Typhoeus.post
      - Typhoeus.put
      - URI.open
    command:
