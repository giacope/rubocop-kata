plugins:
  - rubocop-elegant
  - rubocop-rspec
  - rubocop-performance
  - rubocop-packaging
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  Exclude:
    - "vendor/**/*"

Kata/AgentNoun:
  Description: "Name classes for the thing they are, not the work they do."
  Enabled: true
  VersionAdded: "0.1"
  AllowedNames:
    - Error

Kata/NoComments:
  Description: "Say it in the code; keep only comments the machine or the law reads."
  Enabled: true
  VersionAdded: "0.1"
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Kata/IoDiscipline:
  Description: "Write through an injected io, not bare puts/warn/pp/p."
  Enabled: true
  VersionAdded: "0.1"
  Exclude:
    - "spec/**/*"
    - "bin/**/*"
    - "exe/**/*"
    - "Rakefile"
    - "*.gemspec"

Kata/ProsePlacement:
  Description: "Keep sentence-length strings in the presentation layer."
  Enabled: false
  VersionAdded: "0.1"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/ItBlockParameter:
  EnforcedStyle: only_numbered_parameters

Style/FormatStringToken:
  EnforcedStyle: unannotated

Style/EndlessMethod:
  EnforcedStyle: allow_single_line

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Layout/LineLength:
  Max: 120

Layout/LineEndStringConcatenationIndentation:
  EnforcedStyle: indented

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/ClassLength:
  Max: 100

Metrics/ModuleLength:
  Max: 100
  Exclude:
    - "spec/**/*"

Metrics/MethodLength:
  Max: 5
  Exclude:
    - "spec/**/*"

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true
  Exclude:
    - "spec/**/*"

RSpec/ExampleLength:
  CountAsOne:
    - heredoc

RSpec/VerifiedDoubles:
  Enabled: true

Elegant/NoEmptyLinesInBlocks:
  Exclude:
    - "spec/**/*"

Elegant/NoEmptyLinesInMethods:
  Exclude:
    - "spec/**/*"

Elegant/NoComments:
  Enabled: false

Style/MethodCallWithArgsParentheses:
  Enabled: false

# --- Core layout cops that autocorrect-loop against Elegant/PairedBrackets
# and Elegant/NoEmptyLines*; the Elegant cops win.
Layout/BlockAlignment:
  Enabled: false

Layout/MultilineBlockLayout:
  Enabled: false

Layout/ClosingParenthesisIndentation:
  Enabled: false

Layout/FirstArgumentIndentation:
  Enabled: false

Layout/MultilineMethodCallBraceLayout:
  Enabled: false

Layout/MultilineArrayBraceLayout:
  Enabled: false

Layout/MultilineHashBraceLayout:
  Enabled: false

Layout/EmptyLinesAroundAccessModifier:
  Enabled: false

Layout/EmptyLinesAfterModuleInclusion:
  Enabled: false

# --- Correctors known to rewrite code incorrectly; report only.
# Inlines a variable past side effects (ivar resets, later statements) and
# corrupts Ruby 3.1 keyword shorthand.
Elegant/NoRedundantVariable:
  AutoCorrect: false

# Rewrites reopened classes into modules, clashing with the primary
# class definition at boot.
Style/StaticClass:
  AutoCorrect: false

# Turns lenient `.to_i` into strict Integer(x, 10), which raises on
# nils/Integers call sites legitimately receive.
Lint/NumberConversion:
  AutoCorrect: false

# Alphabetizing requires breaks load-order-dependent boot sequences.
Style/RequireOrder:
  Enabled: false

ThreadSafety/DirChdir:
  Exclude:
    - "spec/**/*"
