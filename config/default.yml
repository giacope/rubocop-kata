Style/MinMaxComparison:
  Enabled: true

Style/ModuleMemberExistenceCheck:
  Enabled: true

Style/MultilineInPatternThen:
  Enabled: true

Style/NegatedIfElseCondition:
  Enabled: true

Style/NegativeArrayIndex:
  Enabled: true

Style/NestedFileDirname:
  Enabled: true

Style/NilLambda:
  Enabled: true

Style/NumberedParameters:
  Enabled: true

Style/NumberedParametersLimit:
  Enabled: true

Style/ObjectThen:
  Enabled: true
  SafeAutoCorrect: false

Style/OpenStructUse:
  Enabled: true

# `o.~(a: 1)` becomes `o ~(a: 1)`, which does not parse (a Sequel spec).
Style/OperatorMethodCall:
  Enabled: true
  SafeAutoCorrect: false

Style/PartitionInsteadOfDoubleSelect:
  Enabled: true

Style/PredicateWithKind:
  Enabled: true

Style/QuotedSymbols:
  Enabled: true

Style/ReduceToHash:
  Enabled: true

Style/RedundantArgument:
  Enabled: true

Style/RedundantArrayConstructor:
  Enabled: true

Style/RedundantArrayFlatten:
  Enabled: true

Style/RedundantConstantBase:
  Enabled: true

Style/RedundantCurrentDirectoryInPath:
  Enabled: true

Style/RedundantDoubleSplatHashBraces:
  Enabled: true

Style/RedundantEach:
  Enabled: true

Style/RedundantFilterChain:
  Enabled: true

Style/RedundantFormat:
  Enabled: true

Style/RedundantHeredocDelimiterQuotes:
  Enabled: true

Style/RedundantInitialize:
  Enabled: true

Style/RedundantInterpolationUnfreeze:
  Enabled: true

Style/RedundantLineContinuation:
  Enabled: true

Style/RedundantMinMaxBy:
  Enabled: true

Style/RedundantRegexpArgument:
  Enabled: true

Style/RedundantRegexpConstructor:
  Enabled: true

Style/RedundantSelfAssignmentBranch:
  Enabled: true

Style/RedundantStringEscape:
  Enabled: true

Style/ReturnNilInPredicateMethodDefinition:
  Enabled: true

Style/ReverseFind:
  Enabled: true

Style/SafeNavigationChainLength:
  Enabled: true

Style/SelectByKind:
  Enabled: true

Style/SelectByRange:
  Enabled: true

Style/SelectByRegexp:
  Enabled: true

Style/SendWithLiteralMethodName:
  Enabled: true

Style/SingleLineDoEndBlock:
  Enabled: true

Style/StringChars:
  Enabled: true

Style/SuperArguments:
  Enabled: true

Style/SuperWithArgsParentheses:
  Enabled: true

Style/SwapValues:
  Enabled: true

Style/TallyMethod:
  Enabled: true

Style/TimeNow:
  Enabled: true

Style/YAMLFileRead:
  Enabled: true

ThreadSafety/ActiveSupportCallbacks:
  Enabled: true

ThreadSafety/LazySynchronizationPrimitive:
  Enabled: true

# Raises on `x.remove_method.must_equal :y` in a spec; a suite is not
# shared mutable state.
ThreadSafety/MethodRedefinition:
  Enabled: true
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "**/*_spec.rb"
    - "**/*_test.rb"
