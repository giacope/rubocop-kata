Kata/IoDiscipline:
  Description: "Write through an injected io, not bare puts/warn/pp/p."
  Enabled: true
  VersionAdded: "0.1"
  VersionChanged: "0.8"
  Exclude:
    - "spec/**/*"
    - "test/**/*"
    - "db/*migrate/**/*"
