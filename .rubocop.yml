plugins:
  - rubocop-kata

AllCops:
  TargetRubyVersion: 3.4
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "eval/support/**/*"

# expect_offense reads `%{message}` as its own template, not as a format string.
Style/FormatStringToken:
  Exclude:
    - "spec/**/*"

# A cop's class name is the config key RuboCop resolves it by — a contract,
# not a naming choice; the file is the boundary.
Kata/GoodClassName:
  Exclude:
    - "lib/rubocop/cop/**/*"

# The parser's node vocabulary is this project's domain language, and the
# evaluation suite counts offenses per kLOC of kata.
Kata/RealWords:
  Terms:
    - kata
    - kloc
    - def
    - defs
    - arg
    - kwargs
    - const
    - str
    - dstr
    - lvasgn
    - ivasgn
    - cvasgn
    - gvasgn
    - optarg
    - kwarg
    - kwoptarg
    - restarg
    - kwrestarg
    - blockarg

# `plan` shells RuboCop at a directory the caller names, and RuboCop keys its
# relative Exclude globs to the process working directory.
ThreadSafety/DirChdir:
  Exclude:
    - "lib/rubocop/kata/plan.rb"


# eval/run is the evaluation suite's executable: the boot layer.
Kata/EnvDiscipline:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "eval/run"
